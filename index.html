<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#faf6ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="샷이음">
<title>샷이음</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --bg:#faf6ef; --panel:#ffffff; --panel2:#f2ece3; --line:#e8e0d4;
  --text:#2b2623; --sub:#8f867c; --accent:#ff5a87; --accent2:#ff8fab; --accentBg:#ffe9ef;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --shadow:0 2px 10px rgba(80,60,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg)}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:50px}
header h1{flex:1;margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 b{color:var(--accent)}
.icon-btn{min-width:36px;height:36px;border-radius:12px;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0 8px;color:var(--text)}
.icon-btn.soft{background:var(--panel2)}
.icon-btn.accent{background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:0 14px;border-radius:18px}
.row{display:flex;gap:6px;padding:0 12px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:32px;padding:0 13px;border-radius:16px;background:var(--panel);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;box-shadow:0 0 0 1px var(--line) inset}
.chip.on{background:var(--accentBg);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.big{height:46px;border-radius:14px;background:var(--panel);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 0 0 1px var(--line) inset;color:var(--text)}
.big.primary{background:var(--accent);color:#fff;box-shadow:none}
.optRow{display:flex;align-items:center;gap:6px;padding:6px 12px}
.optRow .lbl{font-size:12px;font-weight:700;color:var(--sub);flex:0 0 auto}
.optRow .seg button{height:30px;font-size:12px}
.hintline{font-size:11px;color:var(--sub);text-align:center;padding:2px 10px}
footer{text-align:center;font-size:12px;color:var(--sub);padding:6px 0 8px}
footer a{color:var(--accent);text-decoration:none;font-weight:700}
input[type=range]{accent-color:var(--accent);height:26px}
/* ---------- home ---------- */
#home{overflow-y:auto}
.brand{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
.banner{margin:4px 14px 0;border-radius:20px;padding:18px 18px 16px;background:linear-gradient(120deg,#ffd9e3 0%,#ffe9d6 60%,#fff3e3 100%);position:relative;overflow:hidden}
.banner h2{margin:0 0 4px;font-size:22px;line-height:1.3;letter-spacing:-.5px;font-weight:800}
.banner h2 b{color:var(--accent)}
.banner p{margin:0 0 12px;font-size:13px;color:#7a6a60}
.tip{display:flex;align-items:center;gap:7px;max-width:72%;min-height:38px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.72);font-size:12px;line-height:1.35;color:#5d4f46;text-align:left;position:relative;z-index:1}
.tip b{flex:0 0 auto;color:var(--accent);font-size:11px}
.tip span{transition:opacity .3s}
.banner .go{height:36px;padding:0 16px;border-radius:18px;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.banner .deco{position:absolute;right:-8px;bottom:-10px;width:112px;height:112px;transform:rotate(-6deg)}
.banner .deco svg{width:100%;height:100%}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 14px 6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:700}
.tool .ic{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(255,90,135,.18)}
.tool .ic svg{width:28px;height:28px}
.tool small{font-size:11px;color:var(--sub);font-weight:500;margin-top:-4px}
.ic.c1{background:linear-gradient(135deg,#ff8fb1,#ff5a87)} .ic.c2{background:linear-gradient(135deg,#ffb38a,#ff7d6b)} .ic.c3{background:linear-gradient(135deg,#c9a7ff,#9b7bff)}
.secTitle{font-size:14px;font-weight:800;padding:16px 16px 6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px}
.quick button{background:var(--panel);border-radius:14px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;box-shadow:var(--shadow)}
.quick button span{width:38px;height:38px;border-radius:50%;background:var(--accentBg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.quick button span svg{width:20px;height:20px}
.hic svg{width:21px;height:21px;color:var(--text)}
.tip b{display:flex;align-items:center;gap:2px}
.tip b svg{width:14px;height:14px}
/* ---------- 촬영(비교) ---------- */
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;margin:6px 12px;min-height:0}
#compose{position:relative;display:flex;background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--line)}
#compose.tb{flex-direction:column}
.slot{position:relative;overflow:hidden;background:#f4efe7}
.slot canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.slot .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:repeating-linear-gradient(45deg,#f6f1e9,#f6f1e9 10px,#f1ebe1 10px,#f1ebe1 20px);font-size:13px;color:var(--sub);font-weight:600;width:100%}
.slot .empty .plus{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.slot .empty b{color:var(--text);font-size:14px}
.slot .tag{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.85);color:var(--accent);pointer-events:none}
.slot .menu{position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.85);font-size:15px;color:var(--text)}
#textLayer{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;padding:4px 12px 8px}
/* ---------- 카메라 (어두운 화면) ---------- */
#cam{background:#000;color:#fff}
#cam header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:5;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
#cam .icon-btn{color:#fff;background:rgba(255,255,255,.14);font-size:14px;font-weight:700}
#camTitle{text-align:center;font-size:15px}
#camStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#camFrame{position:relative;background:#050505;overflow:hidden}
#camFrame canvas,#camFrame video{position:absolute;inset:0;width:100%;height:100%;display:block}
#camBefore,#camGuides{pointer-events:none}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:92%;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:16px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#match{position:absolute;right:8px;top:60px;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:12px;font-weight:800;font-size:17px;text-align:center;line-height:1.05}
#match small{display:block;font-size:10px;font-weight:600;color:#bbb}
/* 폰을 옆으로 눕혔을 때 안내 글자도 같이 회전 */
#camFrame.r90 #hint{left:24px;top:50%;bottom:auto;max-width:none;transform:translate(-50%,-50%) rotate(90deg)}
#camFrame.rm90 #hint{left:calc(100% - 24px);top:50%;bottom:auto;max-width:none;transform:translate(-50%,-50%) rotate(-90deg)}
#camFrame.r180 #hint{top:10px;bottom:auto;transform:translateX(-50%) rotate(180deg)}
#camFrame.r90 #match{transform:rotate(90deg)}
#camFrame.rm90 #match{transform:rotate(-90deg)}
#camFrame.r180 #match{transform:rotate(180deg)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#camFallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;background:rgba(0,0,0,.88);z-index:3}
#camFallback p{margin:0;font-size:14px;line-height:1.5;color:#ddd}
#camFallback .big{width:100%;max-width:320px}
.camctrl{padding:4px 0 6px;background:#000}
.ovRow{display:flex;align-items:center;gap:6px;padding:2px 12px;font-size:11px;color:#bbb}
.ovRow input{flex:1;min-width:60px}
.ovRow .pc{height:26px;min-width:34px;padding:0 6px;border-radius:13px;background:rgba(255,255,255,.12);font-size:11px;font-weight:700;color:#fff}
.ovRow .pc.on{background:var(--accent)}
.ovRow .peek{border:1px solid var(--accent2);background:transparent;color:var(--accent2);user-select:none;-webkit-user-select:none;touch-action:none}
.shutterRow{display:flex;align-items:center;justify-content:space-around;padding:6px 10px 2px}
#shutter{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px var(--accent)}
.side{width:62px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff}
.side span{font-size:17px}
.side.on{background:var(--accent)}
/* ---------- 편집 ---------- */
#edStage,#colStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;margin:4px 12px;min-height:0}
#edCanvas{max-width:100%;max-height:100%;display:block;touch-action:none;border-radius:4px;background:repeating-conic-gradient(#e9e3d9 0% 25%,#f7f3ec 0% 50%) 50%/18px 18px;box-shadow:var(--shadow)}
#edEmpty{position:absolute;inset:0;margin:auto;width:min(78%,300px);height:160px;border-radius:20px;border:1.5px dashed var(--accent2);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--text)}
#edEmpty span{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
#edBusy{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(43,38,35,.85);color:#fff;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:700;white-space:nowrap;z-index:2}
#edCompare{position:absolute;right:6px;bottom:6px;height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;touch-action:none}
.panel{background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(80,60,40,.06);padding-bottom:4px}
#edPanel{padding:10px 14px 4px;min-height:118px;max-height:32vh;overflow-y:auto}
.desc{font-size:12px;color:var(--sub);margin:0 0 6px;line-height:1.45}
.field{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0}
.field label{width:64px;flex:0 0 auto;font-weight:600}
.field input[type=range]{flex:1}
.field .val{width:34px;text-align:right;color:var(--accent);font-size:12px;font-weight:700}
.miniBtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.miniBtns button{flex:1;min-width:80px;height:34px;border-radius:10px;background:var(--panel2);font-size:12px;font-weight:700}
.miniBtns button.on{background:var(--accentBg);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.miniBtns button.primary{background:var(--accent);color:#fff}
.toolbar{display:flex;gap:2px;overflow-x:auto;padding:6px 6px 8px;scrollbar-width:none;border-top:1px solid var(--line)}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{flex:0 0 auto;min-width:60px;padding:4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub)}
.toolbar button span{font-size:19px;line-height:1;filter:grayscale(.2)}
.toolbar button.on{color:var(--accent)}
.toolbar button.on span{filter:none}
/* ---------- 콜라주 ---------- */
#colCanvas{display:block;touch-action:none;box-shadow:var(--shadow);border-radius:2px}
#colTextFab{position:absolute;right:4px;bottom:4px;height:34px;padding:0 13px;border-radius:17px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;box-shadow:0 3px 10px rgba(255,90,135,.35)}
#colTab{padding:8px 12px 2px;min-height:96px;max-height:30vh;overflow-y:auto}
.lchip{flex:0 0 auto;width:50px;height:50px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.lchip.on{background:var(--accentBg);box-shadow:0 0 0 1.5px var(--accent) inset}
.lchip svg{width:34px;height:34px}
.lrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.lrow::-webkit-scrollbar{display:none}
.fontGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;max-height:34vh;overflow-y:auto;padding:2px}
.fontGrid button{height:48px;border-radius:10px;background:var(--panel2);font-size:16px;line-height:1.1;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fontGrid .fg{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--accent);padding:6px 2px 0}
.fontGrid button small{display:block;font:500 9px var(--font);color:var(--sub)}
.fontGrid button.on{background:var(--accentBg);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.colorRow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.colorRow input[type=color]{width:34px;height:34px;border:0;background:none;padding:0}
/* ---------- sheets ---------- */
.dim{position:fixed;inset:0;background:rgba(40,30,25,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sheet h2 button{background:var(--panel2);width:32px;height:32px;border-radius:10px;font-size:14px}
.sheet h3{font-size:12px;color:var(--accent);margin:14px 0 6px;font-weight:800}
.sheet .list{display:flex;flex-direction:column;gap:7px}
.sheet .list .big{justify-content:flex-start;padding:8px 16px;text-align:left;flex-wrap:wrap;align-content:center;row-gap:2px;height:auto;min-height:48px}
.sheet .list .big small{display:block;width:100%;font-size:11px;font-weight:500;color:var(--sub)}
.sheet .list .big.primary small{color:#ffe3ea}
.opts{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;min-height:56px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px;font:15px var(--font);resize:vertical}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.preview{width:100%;max-height:40vh;object-fit:contain;background:repeating-conic-gradient(#e9e3d9 0% 25%,#f7f3ec 0% 50%) 50%/16px 16px;border-radius:12px;display:block}
.previews{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.previews figure{margin:0;text-align:center;font-size:11px;font-weight:800;color:var(--accent)}
.previews img{width:100%;height:26vh;object-fit:contain;background:var(--panel2);border-radius:10px;display:block;margin-bottom:4px}
.help p,.help li{font-size:13px;line-height:1.6}
.help b{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(43,38,35,.92);color:#fff;padding:9px 14px;border-radius:14px;font-size:13px;font-weight:600;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===== 홈 ===== -->
<div id="home" class="screen">
  <header>
    <h1><span class="brand">BEAUTY BY BIN</span><br>샷<b>이음</b></h1>
    <button class="icon-btn accent hidden" id="installBtn">설치</button>
    <button class="icon-btn hic" id="helpBtn" aria-label="사용법"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
    <button class="icon-btn hic" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="banner">
    <h2>시술 전후,<br><b>같은 구도</b>로 정확하게</h2>
    <p>비포 사진을 겹쳐 보며 애프터를 찍어요</p>
    <button class="tip" id="tip"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>TIP</b><span id="tipText"></span></button>
    <div class="deco"><svg viewBox="0 0 120 120"><defs><clipPath id="dl"><rect x="0" y="0" width="60" height="120"/></clipPath></defs>
      <circle cx="60" cy="60" r="44" fill="#fff" opacity=".75"/><circle cx="60" cy="60" r="44" fill="#ffc2d3" clip-path="url(#dl)" opacity=".9"/>
      <path d="M38 52c6-7 14-8 18-6M64 46c4-2 12-1 18 6" stroke="#2b2623" stroke-width="4" stroke-linecap="round" fill="none" opacity=".85"/>

<script>
'use strict';
/* ========== 1. 설정값 ========== */
const DEF = {
  layout:'tb', ratio:'3:4', proc:'brow', guideOn:true,
  color:'#ffffff', opacity:70, width:2, overlay:40,
  text:'', textPos:'bottom', textSize:6, textColor:'#ffffff',
  labels:false, ver:4, ovMode:'photo', autoShot:false, autoAlign:true
};
let S = Object.assign({}, DEF);
try{ Object.assign(S, JSON.parse(localStorage.getItem('bacam-settings')||'{}')); }catch(e){}
if(S.ver!==4){ S.ratio='3:4'; S.ver=4; }
if(!['brow','lash','body'].includes(S.proc)) S.proc='brow';
function saveS(){ try{ localStorage.setItem('bacam-settings', JSON.stringify(S)); }catch(e){} }
saveS();

const PROCS = [['brow','눈썹'],['lash','속눈썹'],['body','바디']];
const procName = p => (PROCS.find(x=>x[0]===p)||PROCS[0])[1];
const RATIOS = [['free','자유'],['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['9:16','9:16'],['16:9','16:9']];
const CAM_RATIOS = ['3:4','4:5','1:1','9:16'];
const COLORS = [['#ffffff','흰색'],['#000000','검정'],['#ff5a87','분홍']];

const $ = s => document.querySelector(s);
const dpr = () => Math.min(window.devicePixelRatio||1, 3);
const bodyFont = () => getComputedStyle(document.body).fontFamily;
function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ========== 2. 카메라 미리보기 (WebGL, 보정 없음) ========== */
const VS = `attribute vec2 p;varying vec2 v;uniform vec4 crop;uniform float mirror;
void main(){vec2 uv=vec2(p.x*0.5+0.5,0.5-p.y*0.5);if(mirror>0.5)uv.x=1.0-uv.x;v=crop.xy+uv*crop.zw;gl_Position=vec4(p,0.0,1.0);}`;
const FS = `precision mediump float;varying vec2 v;uniform sampler2D t;void main(){gl_FragColor=vec4(texture2D(t,v).rgb,1.0);}`;
class LiveView{
  constructor(canvas){
    this.c=canvas; this.gl=null;
    try{ this.gl = canvas.getContext('webgl',{antialias:false,premultipliedAlpha:false}) || canvas.getContext('experimental-webgl'); }catch(e){}
    const gl=this.gl; if(!gl) return;
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;};
    const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ this.gl=null; return; }
    gl.useProgram(pr);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    this.tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,this.tex);
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    this.u={crop:gl.getUniformLocation(pr,'crop'),mirror:gl.getUniformLocation(pr,'mirror')};
  }
  ok(){ return !!this.gl; }
  render(src,srcW,srcH,crop,outW,outH,mirror){
    const gl=this.gl; if(!gl) return false;
    if(this.c.width!==outW) this.c.width=outW; if(this.c.height!==outH) this.c.height=outH;
    gl.viewport(0,0,outW,outH); gl.bindTexture(gl.TEXTURE_2D,this.tex);
    try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src); }catch(e){ return false; }
    gl.uniform4f(this.u.crop, crop.x/srcW, crop.y/srcH, crop.w/srcW, crop.h/srcH);
    gl.uniform1f(this.u.mirror, mirror?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4); return true;
  }
}
const liveView = new LiveView($('#liveGL'));

/* ========== 3. 사진 칸 ========== */
const slots = [
  {name:'BEFORE', orig:null, proc:null, z:1, cx:0, cy:0},
  {name:'AFTER',  orig:null, proc:null, z:1, cx:0, cy:0}
];
let slotW=100, slotH=100;
function ratioNum(){ if(S.ratio==='free') return null; const [a,b]=S.ratio.split(':').map(Number); return a/b; }
function slotAspect(){ return ratioNum() || (slotW/slotH); }
function cropFor(iw, ih, z, cx, cy, aspect){
  let w0,h0; if(iw/ih > aspect){ h0=ih; w0=ih*aspect; } else { w0=iw; h0=iw/aspect; }
  const w=w0/z, h=h0/z; return {x:cx-w/2, y:cy-h/2, w, h};
}
function cropOf(s, aspect){ return cropFor(s.proc.width, s.proc.height, s.z, s.cx, s.cy, aspect); }
function clampSlot(s){
  if(!s.proc) return; s.z=clamp(s.z,1,10);
  const c=cropOf(s, slotAspect());
  s.cx=clamp(s.cx, c.w/2, s.proc.width-c.w/2); s.cy=clamp(s.cy, c.h/2, s.proc.height-c.h/2);
}
function resetView(s){ if(!s.proc) return; s.z=1; s.cx=s.proc.width/2; s.cy=s.proc.height/2; }
function toCanvas(src, sw, sh, maxSide){
  maxSide=maxSide||2400; const k=Math.min(1, maxSide/Math.max(sw,sh));
  const c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height); return c;
}
function loadFile(file, maxSide){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const c=toCanvas(im,im.naturalWidth,im.naturalHeight,maxSide); URL.revokeObjectURL(url); res(c); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없어요')); };
    im.src=url;
  });
}
function setSlotImage(i, canvas){ dirty.main=true; const s=slots[i]; s.orig=canvas; s.proc=canvas; resetView(s); buildSlots(); drawAll(); }
async function setSlotFile(i, file){ try{ setSlotImage(i, await loadFile(file)); }catch(e){ toast('사진을 불러오지 못했어요. 다른 사진으로 해 보세요.'); } }
function firstEmpty(){ return slots[0].proc? (slots[1].proc? -1 : 1) : 0; }

/* ========== 4. 구도선 ========== */
function drawGuides(ctx, w, h, scale){
  if(!S.guideOn) return;
  ctx.save();
  ctx.strokeStyle=S.color; ctx.fillStyle=S.color;
  ctx.globalAlpha=S.opacity/100; ctx.lineWidth=S.width*scale;
  ctx.shadowColor = S.color==='#000000' ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.45)'; ctx.shadowBlur = 2*scale;
  const L=(x1,y1,x2,y2,dash)=>{ ctx.setLineDash(dash?[8*scale,7*scale]:[]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  L(w/2,0,w/2,h); L(0,h/2,w,h/2);
  ctx.globalAlpha=S.opacity/100*0.85; ctx.lineWidth=S.width*scale*0.9; ctx.setLineDash([7*scale,6*scale]);
  const label=(t,x,y)=>{ ctx.save(); ctx.setLineDash([]); ctx.globalAlpha=Math.min(1,S.opacity/100+0.15); ctx.font=`700 ${Math.max(11,Math.min(w,h)*0.032)}px ${bodyFont()}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore(); };
  if(S.proc==='brow'){
    const y=h*0.40; L(0,y,w,y,true);
    [[1,0.43,0.10],[-1,0.57,0.90]].forEach(([dir,head,tail])=>{
      ctx.beginPath(); ctx.moveTo(w*head, y+h*0.015);
      ctx.quadraticCurveTo(w*(head-dir*0.10), y-h*0.07, w*(tail+dir*0.03), y-h*0.035);
      ctx.quadraticCurveTo(w*tail, y-h*0.02, w*tail, y+h*0.01); ctx.stroke();
    });
    label('눈썹 라인', w*0.5, y-h*0.085);
  } else if(S.proc==='lash'){
    const y=h*0.5, ew=w*0.30, eh=Math.min(h*0.10, ew*0.38);
    [0.27,0.73].forEach(cx=>{ ctx.beginPath(); ctx.moveTo(w*cx-ew/2,y); ctx.quadraticCurveTo(w*cx,y-eh*1.25,w*cx+ew/2,y); ctx.quadraticCurveTo(w*cx,y+eh*0.9,w*cx-ew/2,y); ctx.stroke(); });
    label('눈 위치', w*0.5, y-eh*1.6);
  } else {
    const m=Math.min(w,h)*0.08, r=Math.min(w,h)*0.05;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(m,m,w-2*m,h-2*m,r); else ctx.rect(m,m,w-2*m,h-2*m); ctx.stroke();
    label('시술 부위를 이 안에', w*0.5, m+Math.min(w,h)*0.05);
  }
  ctx.restore();
}
function drawTextOverlay(ctx, W, H, rects){
  const fam=bodyFont();
  if(S.labels && rects){
    rects.forEach(r=>{
      const fs=Math.max(10, Math.min(r.w,r.h)*0.055);
      ctx.save(); ctx.font=`800 ${fs}px ${fam}`; ctx.textBaseline='top';
      const tw=ctx.measureText(r.name).width, pad=fs*0.45;
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(r.x+fs*0.6, r.y+fs*0.6, tw+pad*2, fs+pad*1.4);
      ctx.fillStyle='#ffffff'; ctx.fillText(r.name, r.x+fs*0.6+pad, r.y+fs*0.6+pad*0.75); ctx.restore();
    });
  }
  const txt=(S.text||'').trim(); if(!txt) return;
  const lines=txt.split('\n'); const fs=Math.min(W,H)*S.textSize/100;
  ctx.save(); ctx.font=`700 ${fs}px ${fam}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=S.textColor; ctx.shadowColor=S.textColor==='#000000'?'rgba(255,255,255,.7)':'rgba(0,0,0,.7)'; ctx.shadowBlur=fs*0.25;
  const lh=fs*1.25, total=lh*lines.length;
  let y0 = S.textPos==='center' ? H/2-total/2+lh/2 : H-total-fs*0.4+lh/2;
  if(S.textPos==='top') y0=fs*0.6+lh/2;
  lines.forEach((l,k)=>ctx.fillText(l, W/2, y0+k*lh)); ctx.restore();
}

const compose=$('#compose');
function buildSlots(){
  document.querySelectorAll('.slot').forEach(el=>{
    const i=+el.dataset.i, s=slots[i];
    let cv=el.querySelector('canvas');
    if(!cv){ cv=document.createElement('canvas'); el.appendChild(cv); attachGestures(cv,i);
      const tag=document.createElement('div'); tag.className='tag'; el.appendChild(tag);
      const mb=document.createElement('button'); mb.className='menu'; mb.textContent='⋯'; mb.onclick=()=>slotMenu(i); el.appendChild(mb);
      const em=document.createElement('button'); em.className='empty'; em.onclick=()=>slotMenu(i); el.appendChild(em);
    }
    el.querySelector('.tag').textContent=s.name;
    el.querySelector('.tag').classList.toggle('hidden', S.labels);
    const em=el.querySelector('.empty');
    em.innerHTML=`<div class="plus">+</div><b>${s.name}</b>${i===0?'시술 전 사진':'시술 후 사진'}`;
    em.classList.toggle('hidden', !!s.proc);
    el.querySelector('.menu').classList.toggle('hidden', !s.proc);
  });
}
function layout(){
  const st=$('#stage'); const W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;
  const r=ratioNum(); const lr=S.layout==='lr';
  compose.classList.toggle('tb', !lr);
  if(lr){ if(r){ slotW=Math.min(W/2, H*r); slotH=slotW/r; } else { slotW=W/2; slotH=H; } }
  else { if(r){ slotH=Math.min(H/2, W/r); slotW=slotH*r; } else { slotW=W; slotH=H/2; } }
  slotW=Math.floor(slotW); slotH=Math.floor(slotH);
  compose.style.width=(lr?slotW*2:slotW)+'px'; compose.style.height=(lr?slotH:slotH*2)+'px';
  document.querySelectorAll('.slot').forEach(el=>{ el.style.width=slotW+'px'; el.style.height=slotH+'px'; });
  slots.forEach(clampSlot); drawAll();
}
function drawSlot(i){
  const el=document.querySelector(`.slot[data-i="${i}"]`); const cv=el.querySelector('canvas'); const s=slots[i];
  const k=dpr(); const w=Math.round(slotW*k), h=Math.round(slotH*k);
  if(cv.width!==w) cv.width=w; if(cv.height!==h) cv.height=h;
  const x=cv.getContext('2d'); x.clearRect(0,0,w,h);
  if(!s.proc) return;
  const c=cropOf(s, slotAspect()); x.imageSmoothingQuality='high';
  x.drawImage(s.proc, c.x,c.y,c.w,c.h, 0,0,w,h); drawGuides(x,w,h,k);
}
function drawText(){
  const cv=$('#textLayer'); const k=dpr(); const W=compose.clientWidth, H=compose.clientHeight;
  cv.width=Math.round(W*k); cv.height=Math.round(H*k);
  const x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
  const lr=S.layout==='lr';
  const rects=slots.map((s,i)=>({name:s.name, x:lr?i*slotW*k:0, y:lr?0:i*slotH*k, w:slotW*k, h:slotH*k})).filter((r,i)=>slots[i].proc);
  drawTextOverlay(x,cv.width,cv.height,rects);
}
function drawAll(){ drawSlot(0); drawSlot(1); drawText(); }
function attachGestures(cv, i){
  const pts=new Map(); let lastTap=0, moved=0;
  const scaleOf=s=>{ const c=cropOf(s,slotAspect()); return slotW/c.w; };
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; });
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return; const s=slots[i]; if(!s.proc){ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); return; }
    const prev=new Map(pts); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const rect=cv.getBoundingClientRect(); const ccx=rect.left+rect.width/2, ccy=rect.top+rect.height/2;
    if(pts.size===1){
      const p0=prev.get(e.pointerId), p1=pts.get(e.pointerId); const sc=scaleOf(s);
      s.cx-=(p1.x-p0.x)/sc; s.cy-=(p1.y-p0.y)/sc; moved+=Math.abs(p1.x-p0.x)+Math.abs(p1.y-p0.y);
    } else if(pts.size>=2){
      const ids=[...pts.keys()].slice(0,2); const a0=prev.get(ids[0]), b0=prev.get(ids[1]), a1=pts.get(ids[0]), b1=pts.get(ids[1]);
      const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1, d1=Math.hypot(a1.x-b1.x,a1.y-b1.y)||1;
      const m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2}, m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
      const sc0=scaleOf(s); const px=s.cx+(m0.x-ccx)/sc0, py=s.cy+(m0.y-ccy)/sc0;
      s.z=clamp(s.z*d1/d0,1,10);
      const sc1=scaleOf(s); s.cx=px-(m1.x-ccx)/sc1; s.cy=py-(m1.y-ccy)/sc1; moved+=99;
    }
    clampSlot(s); drawSlot(i);
  });
  const up=e=>{ pts.delete(e.pointerId);
    if(pts.size===0 && moved<6){ const now=Date.now(); if(now-lastTap<320 && slots[i].proc){ resetView(slots[i]); drawSlot(i); } lastTap=now; } };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const s=slots[i]; if(!s.proc) return;
    const rect=cv.getBoundingClientRect(); const ccx=rect.left+rect.width/2, ccy=rect.top+rect.height/2;
    const sc0=scaleOf(s); const px=s.cx+(e.clientX-ccx)/sc0, py=s.cy+(e.clientY-ccy)/sc0;
    s.z=clamp(s.z*(e.deltaY<0?1.1:1/1.1),1,10);
    const sc1=scaleOf(s); s.cx=px-(e.clientX-ccx)/sc1; s.cy=py-(e.clientY-ccy)/sc1; clampSlot(s); drawSlot(i);
  },{passive:false});
}

function drawCamGuides(){ const g=$('#camGuides'); const k=dpr(); g.width=Math.round(frameW*k); g.height=Math.round(frameH*k); const x=g.getContext('2d'); x.clearRect(0,0,g.width,g.height);

/* ===== 얼굴 따라가는 구도선 (기기 안에서만 처리, 사진은 밖으로 나가지 않음) ===== */
let faceLM=null, faceLoading=false, faceTimer=0, faceF=null, faceLost=0, faceToastShown=false;
const faceCv=document.createElement('canvas'), faceCx=faceCv.getContext('2d',{willReadFrequently:true}); let faceErr=0;
async function loadFace(){ // 위쪽 '인공지능' 부분과 같은 라이브러리·모델 사용 (실시간 영상용)
  if(faceLM || faceLoading) return; faceLoading=true;
  try{ const {m,fs}=await mpLoad();
    faceLM=await tryCreate((u,d)=>m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:u,delegate:d},runningMode:'VIDEO',numFaces:1}), FACE_MODELS);
  }catch(e){ console.log('face load fail',e); }

}
function startFace(){
  if(S.proc!=='brow' && S.proc!=='lash' && !hasOverlay()){ return; }

}
function stopFace(){ clearInterval(faceTimer); faceTimer=0; faceF=null; }
function trackFace(){
  if(!camOn || !faceLM || !video.videoWidth || video.readyState<2) return;
  // 카메라(앞·뒤)마다 영상 크기가 달라서, 항상 같은 크기의 작은 그림으로 바꿔서 얼굴을 찾음

  if(faceCv.width!==fw || faceCv.height!==fh){ faceCv.width=fw; faceCv.height=fh; }
  faceCx.drawImage(video,0,0,fw,fh);
  let res; try{ res=faceLM.detectForVideo(faceCv, performance.now()); faceErr=0; }
  catch(e){ if(++faceErr>8){ try{ faceLM.close(); }catch(_){} faceLM=null; faceErr=0; loadFace(); } return; }
  const lm=res && res.faceLandmarks && res.faceLandmarks[0];
  if(!lm){ if(faceF && performance.now()-faceLost>900){ faceF=null; drawCamGuides(); } return; }
  faceLost=performance.now();
  { const vw1=video.videoWidth, vh1=video.videoHeight, c1=videoCrop(), mir=facing==='user';
    liveLM=lm.map(p=>{ let x=(p.x*vw1-c1.x)/c1.w; if(mir) x=1-x; return {x, y:(p.y*vh1-c1.y)/c1.h}; }); liveAt=performance.now(); }

  const P=i=>{ let x=((lm[i].x*vw-c.x)/c.w)*frameW*k, y=((lm[i].y*vh-c.y)/c.h)*frameH*k; if(mirror) x=frameW*k-x; return {x,y}; };

  const eA=mid(P(33),P(133)), eB=mid(P(362),P(263)); // 사진 속 사람의 오른눈 / 왼눈
  let vx=eB.x-eA.x, vy=eB.y-eA.y; if(mirror){ vx=-vx; vy=-vy; }
  const d=Math.hypot(vx,vy); if(d<8) return;
  const n={cx:(eA.x+eB.x)/2, cy:(eA.y+eB.y)/2, ang:Math.atan2(vy,vx), d};

      if(ratio>1.2) msg='📏 조금 멀리서 찍어 주세요';
      else if(ratio<0.82) msg='📏 조금 더 가까이 다가가세요';
      else if(Math.abs(dx)>=Math.abs(dy) && Math.abs(dx)>0.05) msg = front ? mv(dx>0?'l':'r') : mv(dx>0?'r':'l');
      else if(Math.abs(dy)>0.05) msg = front ? mv(dy>0?'u':'d') : mv(dy>0?'d':'u');
    }
    const score=Math.round(100*(skinOK? (0.55*corr+0.45*pos) : corr));
    const m=$('#match'); m.innerHTML=`${score}%<small>매칭률</small>`;
    m.style.color = score>=80?'#3ddc84':score>=60?'#ffcc33':'#ff6b6b';
    if(!msg) msg = score>=80 ? '✅ 잘 맞아요! 촬영하세요' : '비포 사진에 맞춰 천천히 움직여 보세요';
  } else {
    if(L.area>0.55 && S.proc!=='body') msg='📏 조금 멀리서 찍어 주세요';
    else if(L.area>0.03){
      const dx=L.mx-0.5, dy=L.my-0.5;
      if(Math.abs(dx)>=Math.abs(dy) && Math.abs(dx)>0.12) msg = front ? mv(dx>0?'l':'r') : mv(dx>0?'r':'l');
      else if(Math.abs(dy)>0.14) msg = front ? mv(dy>0?'u':'d') : mv(dy>0?'d':'u');
      else msg='✅ 구도 좋아요';
    }
  }
  hint.textContent=msg; hint.classList.toggle('hidden',!msg);
}

function composeImage(){
  const filled=slots.filter(s=>s.proc); if(!filled.length) return null;
  const a=slotAspect(), long=1440;
  const w=Math.round(a>=1?long:long*a), h=Math.round(a>=1?long/a:long);
  const lr=S.layout==='lr', two=filled.length===2;
  const cv=document.createElement('canvas'); cv.width = two&&lr ? w*2 : w; cv.height = two&&!lr ? h*2 : h;
  const x=cv.getContext('2d'); x.imageSmoothingQuality='high'; x.fillStyle='#000'; x.fillRect(0,0,cv.width,cv.height);
  const rects=[];
  filled.forEach((s,k)=>{ const c=cropOf(s,a); const r={name:s.name,x:lr?k*w:0,y:lr?0:k*h,w,h}; x.drawImage(s.proc,c.x,c.y,c.w,c.h,r.x,r.y,w,h); rects.push(r); });
  drawTextOverlay(x,cv.width,cv.height,rects); return cv;
}
function separateImage(s){
  const a=slotAspect(); const c=cropOf(s,a); const k=Math.min(1, 2400/Math.max(c.w,c.h));

  const x=cv.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(s.orig,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height); return cv;
}

const MP_VER='1.2.3';

const FACE_MODELS=['https://huggingface.co/litert-community/MediaPipe-FaceLandmarker/resolve/main/face_landmarker.task',
  'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'];

  'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite'];

function mpLoad(){
  if(!mpP) mpP=(async()=>{ const m=await import(`${MP_BASE}/vision_bundle.mjs`); const fs=await m.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`); return {m,fs}; })();
  mpP.catch(()=>{ mpP=null; }); return mpP;
}
async function tryCreate(make, urls){ let err=null; for(const u of urls) for(const d of ['GPU','CPU']){ try{ return await make(u,d); }catch(e){ err=e; } } throw err||new Error('model load failed'); }
function getFace(){
  if(!faceP) faceP=(async()=>{ const {m,fs}=await mpLoad();
    return tryCreate((u,d)=>m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:u,delegate:d},runningMode:'IMAGE',numFaces:1}), FACE_MODELS); })();
  faceP.catch(()=>{ faceP=null; }); return faceP;
}

/* ========== 14. 이미지 처리 ========== */
function boxPass(s,d,W,H,r,ch,horiz){
  const k=1/(2*r+1), outer=horiz?H:W, inner=horiz?W:H, last=inner-1, step=(horiz?1:W)*ch;
  for(let o=0;o<outer;o++){ const base=(horiz? o*W : o)*ch;

const CROP_RATIOS=[['free','자유'],['orig','원본'],['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['9:16','9:16'],['16:9','16:9']];
function cropRatioVal(){ const r=ED.cropRatio; if(r==='free') return null; if(r==='orig') return ED.W/ED.H; const [a,b]=r.split(':').map(Number); return a/b; }
function cropInit(){
  const a=cropRatioVal(); let w=ED.W, h=ED.H;
  if(a){ if(w/h>a) w=h*a; else h=w/a; } else { w*=0.9; h*=0.9; }
  ED.crop={x:(ED.W-w)/2, y:(ED.H-h)/2, w, h};
}
function drawCropOverlay(x){
  const c=ED.crop, rw=edCv.getBoundingClientRect().width, k=rw? ED.W/rw : 1;
  x.save(); x.fillStyle='rgba(0,0,0,.45)'; x.beginPath(); x.rect(0,0,ED.W,ED.H); x.rect(c.x,c.y,c.w,c.h); x.fill('evenodd');
  x.strokeStyle='#fff'; x.lineWidth=1.5*k; x.strokeRect(c.x,c.y,c.w,c.h);
  x.globalAlpha=0.6; x.lineWidth=1*k; [1,2].forEach(i=>{ x.beginPath(); x.moveTo(c.x+c.w*i/3,c.y); x.lineTo(c.x+c.w*i/3,c.y+c.h); x.moveTo(c.x,c.y+c.h*i/3); x.lineTo(c.x+c.w,c.y+c.h*i/3); x.stroke(); });
  x.globalAlpha=1; x.lineWidth=4*k; const L=18*k;
  [[c.x,c.y,1,1],[c.x+c.w,c.y,-1,1],[c.x,c.y+c.h,1,-1],[c.x+c.w,c.y+c.h,-1,-1]].forEach(([px,py,sx,sy])=>{ x.beginPath(); x.moveTo(px+sx*L,py); x.lineTo(px,py); x.lineTo(px,py+sy*L); x.stroke(); });
  x.restore();
}
function cropApply(){
  const c=ED.crop; if(!c) return;
  const r={x:Math.max(0,Math.round(c.x)),y:Math.max(0,Math.round(c.y)),w:Math.max(8,Math.round(c.w)),h:Math.max(8,Math.round(c.h))};
  r.w=Math.min(r.w,ED.W-r.x); r.h=Math.min(r.h,ED.H-r.y);
  const cut=cv=>{ const n=newMask(r.w,r.h); n.getContext('2d').drawImage(cv,r.x,r.y,r.w,r.h,0,0,r.w,r.h); return n; };
  const oldW=ED.W;
  const nb=cut(ED.baseCanvas); ED.mzPix=cut(ED.mzPix); ED.mzBlur=cut(ED.mzBlur); ED.segAdd=cut(ED.segAdd); ED.segSub=cut(ED.segSub);
  if(ED.seg){ const s=new Float32Array(r.w*r.h); for(let y=0;y<r.h;y++) for(let x=0;x<r.w;x++) s[y*r.w+x]=ED.seg[(y+r.y)*oldW+(x+r.x)]; ED.seg=s; }
  if(ED.lm) ED.lm=ED.lm.map(p=>({x:p.x-r.x,y:p.y-r.y}));
  edSetBase(nb); ED.undo=[]; cropInit(); edFit(); edRender(true); toast('잘랐어요');
}

(()=>{
  let mode=null, last=null, corner=-1, start=null, t=0;
  const toImg=e=>{ const r=edCv.getBoundingClientRect(); return {x:(e.clientX-r.left)*ED.W/r.width, y:(e.clientY-r.top)*ED.H/r.height, k:ED.W/r.width}; };
  function stroke(a,b){
    const mx=ED.paintCv.getContext('2d'); mx.strokeStyle='#fff'; mx.lineCap='round'; mx.lineJoin='round';
    const br = ED.tool==='bg' ? ED.p.sbrush : ED.p.brush;
    mx.lineWidth=Math.min(ED.W,ED.H)*(0.015+br/100*0.12);
    mx.beginPath(); mx.moveTo(a.x,a.y); mx.lineTo(b.x+0.01,b.y); mx.stroke();
    const now=Date.now(); if(now-t>90){ t=now; ED.out.getContext('2d').putImageData(edCompose(),0,0); edShow(); }
  }
  edCv.addEventListener('pointerdown',e=>{
    if(!ED.base) return; const p=toImg(e);
    if(ED.tool==='crop' && ED.crop){
      const c=ED.crop, hit=30*p.k; const cs=[[c.x,c.y],[c.x+c.w,c.y],[c.x,c.y+c.h],[c.x+c.w,c.y+c.h]];
      corner=cs.findIndex(([x,y])=>Math.hypot(p.x-x,p.y-y)<hit);
      if(corner>=0) mode='corner'; else if(p.x>c.x&&p.x<c.x+c.w&&p.y>c.y&&p.y<c.y+c.h) mode='move'; else return;
      start={p, c:Object.assign({},c)}; edCv.setPointerCapture(e.pointerId); return;
    }
    let cv=null;
    if(ED.tool==='mosaic'){ const bl=ED.p.mtype==='blur'; cv = bl?ED.mzBlur:ED.mzPix; ED.used[bl?'blur':'pix']=true; }
    else if(ED.tool==='bg' && ED.segBrush!=='off'){ cv = ED.segBrush==='add'?ED.segAdd:ED.segSub; ED.used.seg=true; }
    if(!cv) return;
    edCv.setPointerCapture(e.pointerId); mode='paint'; last=p; ED.paintCv=cv;
    ED.undo.push({cv, img:cv.getContext('2d').getImageData(0,0,ED.W,ED.H)}); if(ED.undo.length>15) ED.undo.shift();
    stroke(last,p);
  });
  edCv.addEventListener('pointermove',e=>{
    if(!mode) return; const p=toImg(e);
    if(mode==='paint'){ stroke(last,p); last=p; return; }
    const c=ED.crop, s=start.c, dx=p.x-start.p.x, dy=p.y-start.p.y, a=cropRatioVal(), min=40*p.k;
    if(mode==='move'){ c.x=clamp(s.x+dx,0,ED.W-s.w); c.y=clamp(s.y+dy,0,ED.H-s.h); }
    else {
      const left=corner%2===0, top=corner<2;
      const fx = left ? s.x+s.w : s.x, fy = top ? s.y+s.h : s.y;
      const nx = left ? clamp(s.x+dx,0,fx-min) : clamp(s.x+s.w+dx,fx+min,ED.W);
      const ny = top ? clamp(s.y+dy,0,fy-min) : clamp(s.y+s.h+dy,fy+min,ED.H);
      let w=Math.abs(nx-fx), h=Math.abs(ny-fy);
      if(a){ if(w/h>a) w=h*a; else h=w/a;
        const maxW = left ? fx : ED.W-fx, maxH = top ? fy : ED.H-fy;
        if(w>maxW){ w=maxW; h=w/a; } if(h>maxH){ h=maxH; w=h*a; } }
      c.w=w; c.h=h; c.x = left ? fx-w : fx; c.y = top ? fy-h : fy;
    }
    edShow();
  });
  const end=()=>{ if(!mode) return; const m=mode; mode=null; if(m==='paint'){ edRender(true); edPanel(); } };
  edCv.addEventListener('pointerup',end); edCv.addEventListener('pointercancel',end);
})();

const fontCss = f => f==='system' ? 'var(--font)' : `'${f}'`;
const fontCanvas = f => f==='system' ? bodyFont() : `"${f}"`;

/* 레이아웃: 칸 = 다각형 (0~1 좌표) */
const R=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const COL_LAYOUTS={
  '2h':[R(0,0,.5,1),R(.5,0,.5,1)], '2v':[R(0,0,1,.5),R(0,.5,1,.5)],
  '3h':[R(0,0,1/3,1),R(1/3,0,1/3,1),R(2/3,0,1/3,1)], '3v':[R(0,0,1,1/3),R(0,1/3,1,1/3),R(0,2/3,1,1/3)],
  '3a':[R(0,0,.5,1),R(.5,0,.5,.5),R(.5,.5,.5,.5)], '3b':[R(0,0,1,.5),R(0,.5,.5,.5),R(.5,.5,.5,.5)],
  '4':[R(0,0,.5,.5),R(.5,0,.5,.5),R(0,.5,.5,.5),R(.5,.5,.5,.5)],
  '4a':[R(0,0,1,.6),R(0,.6,1/3,.4),R(1/3,.6,1/3,.4),R(2/3,.6,1/3,.4)],
  '6':[0,1,2].flatMap(r=>[0,1].map(c=>R(c/2,r/3,1/2,1/3))),
  '9':[0,1,2].flatMap(r=>[0,1,2].map(c=>R(c/3,r/3,1/3,1/3))),
  'd2':[[[0,0],[.62,0],[.38,1],[0,1]],[[.62,0],[1,0],[1,1],[.38,1]]],
  'd2v':[[[0,0],[1,0],[1,.38],[0,.62]],[[0,.62],[1,.38],[1,1],[0,1]]],
  'd3':[[[0,0],[.45,0],[.22,1],[0,1]],[[.45,0],[.78,0],[.55,1],[.22,1]],[[.78,0],[1,0],[1,1],[.55,1]]],
  'd3v':[[[0,0],[1,0],[1,.25],[0,.42]],[[0,.42],[1,.25],[1,.6],[0,.77]],[[0,.77],[1,.6],[1,1],[0,1]]],
  'd3a':[[[0,0],[.6,0],[.4,1],[0,1]],[[.6,0],[1,0],[1,.45],[.5,.5]],[[.5,.5],[1,.45],[1,1],[.4,1]]],
  'd4':[[[0,0],[.58,0],[.5,.5],[0,.42]],[[.58,0],[1,0],[1,.58],[.5,.5]],[[0,.42],[.5,.5],[.42,1],[0,1]],[[.5,.5],[1,.58],[1,1],[.42,1]]],
  'dx':[[[0,0],[1,0],[.5,.5]],[[1,0],[1,1],[.5,.5]],[[1,1],[0,1],[.5,.5]],[[0,1],[0,0],[.5,.5]]]
};
const COL_RATIOS=[['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['9:16','9:16'],['16:9','16:9']];
const COL_BG=['#ffffff','#faf6ef','#ffe3ec','#f2e8ff','#e6f4f1','#2b2623','#000000','#ff5a87'];
const CL={mode:'grid',layout:'2h',ratio:'4:5',seam:0,gap:10,frame:4,bg:'#ffffff',cells:[],items:[],texts:[],sel:-1,selItem:-1,tab:'layout'};
const colCv=$('#colCanvas'); let colW=100,colH=100;
function colRatio(){ const [a,b]=CL.ratio.split(':').map(Number); return a/b; }
function colEnsureCells(){ const n=COL_LAYOUTS[CL.layout].length; while(CL.cells.length<n) CL.cells.push({img:null,z:1,cx:0,cy:0}); }
function polyBox(poly,W,H){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; poly.forEach(([x,y])=>{ x0=Math.min(x0,x*W); y0=Math.min(y0,y*H); x1=Math.max(x1,x*W); y1=Math.max(y1,y*H); }); return {x:x0,y:y0,w:x1-x0,h:y1-y0}; }
function inPoly(px,py,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi+1e-12)+xi)) c=!c; } return c; }
function polyPath(x,poly,W,H){ x.beginPath(); poly.forEach(([px,py],i)=>i?x.lineTo(px*W,py*H):x.moveTo(px*W,py*H)); x.closePath(); }
function cellAspect(i){ const b=polyBox(COL_LAYOUTS[CL.layout][i],colW,colH); return b.w/b.h; }
function colClamp(i){
  const c=CL.cells[i]; if(!c||!c.img) return; const a=cellAspect(i); c.z=clamp(c.z,1,10);
  const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,a);
  c.cx=clamp(c.cx,cr.w/2,c.img.width-cr.w/2); c.cy=clamp(c.cy,cr.h/2,c.img.height-cr.h/2);
}
function colLayout(){
  colEnsureCells();
  const st=$('#colStage'); const W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;
  const a=colRatio(); if(W/H>a){ colH=H; colW=H*a; } else { colW=W; colH=W/a; }
  colW=Math.floor(colW); colH=Math.floor(colH);
  colCv.style.width=colW+'px'; colCv.style.height=colH+'px';
  const k=dpr(); colCv.width=Math.round(colW*k); colCv.height=Math.round(colH*k);
  CL.cells.forEach((c,i)=>{ if(i<COL_LAYOUTS[CL.layout].length) colClamp(i); }); colDraw();
}
function itemSize(it,W){ const w=it.w*W; return {w, h:w*it.img.height/it.img.width}; }
function textBox(x,t,W){
  const fs=t.size/100*W; x.font=`${t.bold?'700':'400'} ${fs}px ${fontCanvas(t.font)}`;
  const lines=(t.text||' ').split('\n'); const lh=fs*1.25; const tw=Math.max(...lines.map(l=>x.measureText(l).width));
  return {fs,lines,lh,w:tw,h:lh*lines.length};
}
function rr(x,a,b,w,h,r){ x.beginPath(); if(r>0 && x.roundRect) x.roundRect(a,b,w,h,r); else x.rect(a,b,w,h); }
function colRender(x,W,H,forExport){
  x.save(); x.fillStyle=CL.bg; x.fillRect(0,0,W,H);
  if(CL.mode==='grid'){
    const polys=COL_LAYOUTS[CL.layout];
    polys.forEach((poly,i)=>{
      const c=CL.cells[i], b=polyBox(poly,W,H);
      x.save(); polyPath(x,poly,W,H); x.clip();
      if(c && c.img){ const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,b.w/b.h); x.imageSmoothingQuality='high'; x.drawImage(c.img,cr.x,cr.y,cr.w,cr.h,b.x,b.y,b.w,b.h); }
      else if(!forExport){
        x.fillStyle='rgba(180,165,150,.18)'; x.fillRect(b.x,b.y,b.w,b.h);
        let cx=0,cy=0; poly.forEach(([px,py])=>{cx+=px;cy+=py;}); cx=cx/poly.length*W; cy=cy/poly.length*H;
        x.fillStyle='rgba(140,125,110,.85)'; x.font=`700 ${Math.max(11,Math.min(b.w,b.h)*0.11)}px ${bodyFont()}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('＋ 사진',cx,cy);
      }
      x.restore();
    });
    if(CL.seam>0) drawSeamless(x,W,H,polys);
    const g=CL.seam>0 ? 0 : CL.gap/1000*Math.min(W,H)*2.2;
    if(g>0){ x.save(); x.strokeStyle=CL.bg; x.lineJoin='miter'; x.lineWidth=g; polys.forEach(poly=>{ polyPath(x,poly,W,H); x.stroke(); }); x.lineWidth=g*2; x.strokeRect(0,0,W,H); x.restore(); }
  } else {
    CL.items.forEach((it,i)=>{
      const s=itemSize(it,W), fr=CL.frame/100*s.w*0.6;
      x.save(); x.translate(it.x*W,it.y*H); x.rotate(it.rot);
      x.shadowColor='rgba(60,40,30,.25)'; x.shadowBlur=W*0.02; x.shadowOffsetY=W*0.006;
      x.fillStyle='#fff'; x.fillRect(-s.w/2-fr,-s.h/2-fr,s.w+fr*2,s.h+fr*2); x.shadowColor='transparent';
      x.drawImage(it.img,-s.w/2,-s.h/2,s.w,s.h);
      if(!forExport && i===CL.selItem){ x.setLineDash([6,5]); x.strokeStyle='#ff5a87'; x.lineWidth=Math.max(1.5,W/300); x.strokeRect(-s.w/2-fr-4,-s.h/2-fr-4,s.w+fr*2+8,s.h+fr*2+8); }
      x.restore();
    });
    if(!CL.items.length && !forExport){ x.fillStyle='rgba(140,125,110,.85)'; x.font=`700 ${W*0.04}px ${bodyFont()}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('위의 🖼 버튼으로 사진을 넣어 주세요',W/2,H/2); }
  }
  CL.texts.forEach((t,i)=>{
    const b=textBox(x,t,W); const cx=t.x*W, cy=t.y*H; x.save(); x.globalAlpha=(t.alpha??100)/100;
    x.textAlign='center'; x.textBaseline='middle'; const top=cy-b.h/2;
    if(t.box){ const pad=b.fs*0.35; x.fillStyle=t.boxColor||'rgba(0,0,0,.55)'; rr(x,cx-b.w/2-pad,top-pad*0.6,b.w+pad*2,b.h+pad*1.2,pad); x.fill(); }
    b.lines.forEach((l,k)=>{ const y=top+b.lh*(k+0.5);
      if(t.outline){ x.lineJoin='round'; x.lineWidth=Math.max(2,b.fs*0.14); x.strokeStyle=t.outlineColor||'#000'; x.strokeText(l,cx,y); }
      if(t.shadow){ x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=b.fs*0.25; }
      x.fillStyle=t.color; x.fillText(l,cx,y); x.shadowBlur=0; });
    x.restore();
    if(!forExport && i===CL.sel){ x.save(); x.setLineDash([6,5]); x.strokeStyle='#ff5a87'; x.lineWidth=Math.max(1.5,W/300); x.strokeRect(cx-b.w/2-8,top-6,b.w+16,b.h+12); x.restore(); }
  });
  x.restore();
}
// 심리스: 각 사진 가장자리를 부드럽게 흐려서 옆 사진과 자연스럽게 섞기
function drawSeamless(x,W,H,polys){
  const f=CL.seam/100*Math.min(W,H)*0.2; if(f<1) return;
  polys.forEach((poly,i)=>{
    const c=CL.cells[i]; if(!c||!c.img) return;
    const b=polyBox(poly,W,H); const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,b.w/b.h); const s=b.w/cr.w;
    const ow=Math.ceil(b.w+2*f), oh=Math.ceil(b.h+2*f);
    const o=newMask(ow,oh), ox=o.getContext('2d'); ox.imageSmoothingQuality='high';
    ox.drawImage(c.img, f-cr.x*s, f-cr.y*s, c.img.width*s, c.img.height*s);
    const k=Math.min(1,220/Math.max(ow,oh)), mw=Math.max(2,Math.round(ow*k)), mh=Math.max(2,Math.round(oh*k));
    const m=newMask(mw,mh), mx=m.getContext('2d'); mx.fillStyle='#fff'; mx.beginPath();
    poly.forEach(([px,py],j)=>{ const X=(px*W-b.x+f)*k, Y=(py*H-b.y+f)*k; j?mx.lineTo(X,Y):mx.moveTo(X,Y); }); mx.closePath(); mx.fill();
    const id=mx.getImageData(0,0,mw,mh); const a=new Float32Array(mw*mh); for(let j=0;j<a.length;j++) a[j]=id.data[j*4+3];
    const bl=blur1(a,mw,mh,Math.max(1,f*k*0.55),3); for(let j=0;j<a.length;j++) id.data[j*4+3]=bl[j];
    mx.putImageData(id,0,0);
    ox.globalCompositeOperation='destination-in'; ox.imageSmoothingQuality='high'; ox.drawImage(m,0,0,ow,oh);
    x.drawImage(o,b.x-f,b.y-f);
  });
}
function colDraw(){ colRender(colCv.getContext('2d'),colCv.width,colCv.height,false); }
async function colEnsureFont(t){ if(t.font==='system' || !document.fonts) return; try{ await document.fonts.load(`${t.bold?'700':'400'} 40px "${t.font}"`, t.text||'가A'); }catch(e){} }
function colAddItem(img){ const n=CL.items.length; CL.items.push({img, x:0.3+((n*0.17)%0.45), y:0.3+((n*0.23)%0.45), w:0.5, rot:((n%3)-1)*0.08}); }
async function colSetCellFile(i,file){ try{ const c=await loadFile(file,2000); CL.cells[i]={img:c,z:1,cx:c.width/2,cy:c.height/2}; dirty.collage=true; colClamp(i); colDraw(); }catch(e){ toast('사진을 불러오지 못했어요'); } }
function colReplaceImg(from,img){
  if(from.mode==='free'){ const it=CL.items[from.cell]; if(it) it.img=img; }
  else { CL.cells[from.cell]={img,z:1,cx:img.width/2,cy:img.height/2}; }
  requestAnimationFrame(colLayout);
}
let colTarget=-1;
function colPick(i){ colTarget=i; const f=$('#fileCollage'); f.value=''; f.multiple = i<0; f.click(); }
$('#fileCollage').addEventListener('change',async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  if(CL.mode==='free'){
    if(colTarget>=0){ try{ CL.items[colTarget].img=await loadFile(files[0],2000); }catch(err){} colDraw(); return; }
    for(const f of files){ try{ colAddItem(await loadFile(f,2000)); dirty.collage=true; }catch(err){} } CL.selItem=CL.items.length-1; colDraw(); return;
  }
  colEnsureCells();
  if(colTarget>=0){ await colSetCellFile(colTarget,files[0]); return; }
  let fi=0; const n=COL_LAYOUTS[CL.layout].length;
  for(let i=0;i<n && fi<files.length;i++){ if(!CL.cells[i].img) await colSetCellFile(i,files[fi++]); }
  for(let i=0;i<n && fi<files.length;i++){ await colSetCellFile(i,files[fi++]); }
  if(files.length>n) toast(`칸이 ${n}개라 ${n}장만 넣었어요`);
});
$('#colPhotos').onclick=()=>colPick(-1);

/* 콜라주 손가락 조작 */
(()=>{
  const pts=new Map(); let mode=null, idx=-1, moved=0, lastTap=0, lastTapIdx=-1;
  const local=e=>{ const r=colCv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };
  function hitText(p){ const x=colCv.getContext('2d'); const W=colCv.width,H=colCv.height;
    for(let i=CL.texts.length-1;i>=0;i--){ const t=CL.texts[i]; const b=textBox(x,t,W); if(Math.abs(p.x*W-t.x*W)<=b.w/2+14 && Math.abs(p.y*H-t.y*H)<=b.h/2+12) return i; } return -1; }
  function hitCell(p){ const ps=COL_LAYOUTS[CL.layout]; for(let i=0;i<ps.length;i++) if(inPoly(p.x,p.y,ps[i])) return i; return -1; }
  function hitItem(p){ for(let i=CL.items.length-1;i>=0;i--){ const it=CL.items[i]; const s=itemSize(it,colW); const dx=(p.x-it.x)*colW, dy=(p.y-it.y)*colH;
      const c=Math.cos(-it.rot), sn=Math.sin(-it.rot); const lx=dx*c-dy*sn, ly=dx*sn+dy*c; if(Math.abs(lx)<=s.w/2+8 && Math.abs(ly)<=s.h/2+8) return i; } return -1; }
  colCv.addEventListener('pointerdown',e=>{
    colCv.setPointerCapture(e.pointerId); const p=local(e); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ moved=0; const ti=hitText(p);
      if(ti>=0){ mode='text'; idx=ti; CL.sel=ti; }
      else if(CL.mode==='free'){ mode='item'; idx=hitItem(p); CL.sel=-1; if(idx>=0 && idx!==CL.items.length-1){ const it=CL.items.splice(idx,1)[0]; CL.items.push(it); idx=CL.items.length-1; lastTapIdx=-2; } CL.selItem=idx; }
      else { mode='cell'; idx=hitCell(p); CL.sel=-1; }
      colDraw(); }
  });
  colCv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=new Map(pts); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const r=colCv.getBoundingClientRect();
    const two=()=>{ const ids=[...pts.keys()].slice(0,2); const a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=pts.get(ids[0]),b1=pts.get(ids[1]);
      return {sc:(Math.hypot(a1.x-b1.x,a1.y-b1.y)||1)/(Math.hypot(a0.x-b0.x,a0.y-b0.y)||1), rot:Math.atan2(b1.y-a1.y,b1.x-a1.x)-Math.atan2(b0.y-a0.y,b0.x-a0.x),
        mx:((a1.x+b1.x)-(a0.x+b0.x))/2, my:((a1.y+b1.y)-(a0.y+b0.y))/2}; };
    const one=()=>{ const p0=prev.get(e.pointerId), p1=pts.get(e.pointerId); moved+=Math.abs(p1.x-p0.x)+Math.abs(p1.y-p0.y); return {dx:p1.x-p0.x, dy:p1.y-p0.y}; };
    if(pts.size>=2 && !prev.has([...pts.keys()][1])) return;
    if(mode==='text' && idx>=0){ const t=CL.texts[idx];
      if(pts.size===1){ const d=one(); t.x=clamp(t.x+d.dx/r.width,0,1); t.y=clamp(t.y+d.dy/r.height,0,1); }
      else { const g=two(); t.size=clamp(t.size*g.sc,2,40); moved+=99; }
      colDraw(); return; }
    if(mode==='item' && idx>=0){ const it=CL.items[idx];
      if(pts.size===1){ const d=one(); it.x=clamp(it.x+d.dx/r.width,0,1); it.y=clamp(it.y+d.dy/r.height,0,1); }
      else { const g=two(); it.w=clamp(it.w*g.sc,0.08,1.6); it.rot+=g.rot; it.x=clamp(it.x+g.mx/r.width,0,1); it.y=clamp(it.y+g.my/r.height,0,1); moved+=99; }
      colDraw(); return; }
    if(mode==='cell' && idx>=0){ const c=CL.cells[idx]; if(!c||!c.img) return;
      const b=polyBox(COL_LAYOUTS[CL.layout][idx],colW,colH); const sc=()=>{ const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,b.w/b.h); return b.w/cr.w; };
      if(pts.size===1){ const d=one(); const s=sc(); c.cx-=d.dx/s; c.cy-=d.dy/s; }
      else { const g=two(); c.z*=g.sc; const s=sc(); c.cx-=g.mx/s; c.cy-=g.my/s; moved+=99; }
      colClamp(idx); colDraw(); }
  });
  const up=e=>{
    if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if(pts.size>0) return;
    if(moved<6){ const now=Date.now();
      if(mode==='text' && idx>=0) textSheet(idx);
      else if(mode==='item'){ if(idx>=0 && now-lastTap<350 && lastTapIdx===idx) itemMenu(idx); }
      else if(mode==='cell' && idx>=0){ const c=CL.cells[idx];
        if(!c||!c.img) colPick(idx);
        else if(now-lastTap<320 && lastTapIdx===idx){ c.z=1; c.cx=c.img.width/2; c.cy=c.img.height/2; colDraw(); lastTapIdx=-1; mode=null; return; }
        else { const i=idx, at=now; setTimeout(()=>{ if(lastTap===at) cellMenu(i); },340); } }
      lastTap=now; lastTapIdx=idx; }
    mode=null;
  };
  colCv.addEventListener('pointerup',up); colCv.addEventListener('pointercancel',up);
})();
function cellMenu(i){
  openSheet(`<h2>${i+1}번 칸 <button data-close>✕</button></h2><div class="list">
    <button class="big" id="cm1">🖼 다른 사진으로 바꾸기</button><button class="big" id="cm2">🎨 이 사진 편집하기</button><button class="big" id="cm3">🗑 이 칸 비우기</button></div>`, sh=>{
    sh.querySelector('#cm1').onclick=()=>{ closeSheet(); colPick(i); };
    sh.querySelector('#cm2').onclick=()=>{ closeSheet(); go('edit'); edLoad(CL.cells[i].img,{cell:i,mode:'grid'}); };
    sh.querySelector('#cm3').onclick=()=>{ closeSheet(); CL.cells[i]={img:null,z:1,cx:0,cy:0}; colDraw(); };
  });
}
function itemMenu(i){
  openSheet(`<h2>사진 <button data-close>✕</button></h2><div class="list">
    <button class="big" id="im1">🖼 다른 사진으로 바꾸기</button><button class="big" id="im2">🎨 이 사진 편집하기</button><button class="big" id="im3">↺ 각도 바로 세우기</button><button class="big" id="im4">🗑 이 사진 빼기</button></div>`, sh=>{
    sh.querySelector('#im1').onclick=()=>{ closeSheet(); colPick(i); };
    sh.querySelector('#im2').onclick=()=>{ closeSheet(); go('edit'); edLoad(CL.items[i].img,{cell:i,mode:'free'}); };
    sh.querySelector('#im3').onclick=()=>{ closeSheet(); CL.items[i].rot=0; colDraw(); };
    sh.querySelector('#im4').onclick=()=>{ closeSheet(); CL.items.splice(i,1); CL.selItem=-1; colDraw(); };
  });
}

/* 글자 */
const TXT_COLORS=['#ffffff','#000000','#2b2623','#ff5a87','#ff8a3d','#ffd84d','#7b5cff','#2f7bff','#1fb6a6','#c2185b'];
function addText(){ loadFonts(); dirty.collage=true; CL.texts.push({text:'뷰티바이빈',font:'Jua',size:9,color:'#ffffff',alpha:100,bold:false,outline:true,outlineColor:'#2b2623',box:false,shadow:false,x:0.5,y:0.5}); CL.sel=CL.texts.length-1; colEnsureFont(CL.texts[CL.sel]).then(colDraw); colDraw(); textSheet(CL.sel); }
$('#colTextFab').onclick=addText;
function textSheet(i){
  const t=CL.texts[i]; if(!t) return; loadFonts(); if(t.alpha===undefined) t.alpha=100;
  const sw=(list,cur,attr)=>list.map(c=>`<button class="sw ${cur===c?'on':''}" style="background:${c}" ${attr}="${c}"></button>`).join('');
  openSheet(`<h2>글자 <button data-close>✓</button></h2>
    <textarea id="tIn" placeholder="글자를 입력하세요">${esc(t.text)}</textarea>
    <h3>글씨체</h3><div class="fontGrid">${fontGroups().map(([g,list])=>`<div class="fg">${g}</div>`+list.map(f=>{ const l=(FONTS.find(x=>x[0]===f)||[f,f])[1]; const en=g.startsWith('영문'); return `<button data-f="${esc(f)}" class="${t.font===f?'on':''}" style="font-family:${fontCss(f)}">${en?'Beauty':'가나다 Ab'}<small>${l}</small></button>`; }).join('')).join('')}</div>
    <div class="field" style="margin-top:8px"><label>크기</label><input type="range" min="2" max="30" step="0.5" id="tSize" value="${t.size}"><span class="val">${t.size}</span></div>
    <div class="field"><label>투명도</label><input type="range" min="5" max="100" id="tAlpha" value="${t.alpha}"><span class="val">${t.alpha}</span></div>
    <h3>글자 색</h3><div class="colorRow">${sw(TXT_COLORS,t.color,'data-c')}<input type="color" id="tColor" value="${t.color}"></div>
    <label class="toggle">굵게 <input type="checkbox" id="tBold" ${t.bold?'checked':''}></label>
    <label class="toggle">테두리 <input type="checkbox" id="tOut" ${t.outline?'checked':''}></label>
    <div class="colorRow" style="padding:6px 0">${sw(['#2b2623','#ffffff','#ff5a87','#c2185b'],t.outlineColor,'data-oc')}</div>
    <label class="toggle">그림자 <input type="checkbox" id="tShadow" ${t.shadow?'checked':''}></label>
    <label class="toggle">배경 상자 <input type="checkbox" id="tBox" ${t.box?'checked':''}></label>
    <div class="colorRow" style="padding:6px 0">${sw(['rgba(0,0,0,.55)','#ffffff','#ff5a87','#ffe3ec'],t.boxColor||'rgba(0,0,0,.55)','data-bc')}</div>
    <div class="miniBtns" style="margin-top:12px"><button id="tDel">🗑 이 글자 지우기</button><button id="tDone" class="primary">✓ 완료</button></div>`, sh=>{
    const upd=()=>{ colEnsureFont(t).then(colDraw); colDraw(); };
    sh.querySelector('#tIn').oninput=e=>{ t.text=e.target.value; upd(); };
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ t.font=b.dataset.f; sh.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
    sh.querySelector('#tSize').oninput=e=>{ t.size=+e.target.value; e.target.nextElementSibling.textContent=e.target.value; upd(); };
    sh.querySelector('#tAlpha').oninput=e=>{ t.alpha=+e.target.value; e.target.nextElementSibling.textContent=e.target.value; upd(); };
    sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ t.color=b.dataset.c; sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
    sh.querySelector('#tColor').oninput=e=>{ t.color=e.target.value; upd(); };
    sh.querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{ t.outlineColor=b.dataset.oc; t.outline=true; sh.querySelector('#tOut').checked=true; sh.querySelectorAll('[data-oc]').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
    sh.querySelectorAll('[data-bc]').forEach(b=>b.onclick=()=>{ t.boxColor=b.dataset.bc; t.box=true; sh.querySelector('#tBox').checked=true; sh.querySelectorAll('[data-bc]').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
    sh.querySelector('#tBold').onchange=e=>{ t.bold=e.target.checked; upd(); };
    sh.querySelector('#tOut').onchange=e=>{ t.outline=e.target.checked; upd(); };
    sh.querySelector('#tShadow').onchange=e=>{ t.shadow=e.target.checked; upd(); };
    sh.querySelector('#tBox').onchange=e=>{ t.box=e.target.checked; upd(); };
    sh.querySelector('#tDel').onclick=()=>{ CL.texts.splice(i,1); CL.sel=-1; closeSheet(); };
    sh.querySelector('#tDone').onclick=closeSheet;
  }, ()=>{ CL.sel=-1; colDraw(); if(CL.tab==='text') colTabRender(); });
}

/* 콜라주 아래 메뉴 */
const COL_TABS=[['layout','▦','레이아웃'],['border','⬚','테두리'],['ratio','⛶','비율'],['text','T','글자'],['free','🃏','프리'],['bg','🎨','배경']];
function layoutIcon(k,polys){ const on=CL.mode==='grid'&&CL.layout===k; return `<button class="lchip ${on?'on':''}" data-l="${k}"><svg viewBox="0 0 40 40">${polys.map(p=>`<polygon points="${p.map(([x,y])=>`${(x*36+2).toFixed(1)},${(y*36+2).toFixed(1)}`).join(' ')}" fill="${on?'#ff5a87':'#cfc6ba'}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>`).join('')}</svg></button>`; }
function rngC(key,label,min,max){ return `<div class="field"><label style="width:96px">${label}</label><input type="range" min="${min}" max="${max}" data-c="${key}" value="${CL[key]}"><span class="val">${CL[key]}</span></div>`; }
function colTabRender(){
  $('#colTabs').innerHTML=COL_TABS.map(([v,i,l])=>`<button class="${CL.tab===v?'on':''}" data-t="${v}"><span>${i}</span>${l}</button>`).join('');
  $('#colTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ CL.tab=b.dataset.t; if(CL.tab==='free' && CL.mode!=='free') setColMode('free'); if(CL.tab==='layout' && CL.mode!=='grid') setColMode('grid'); colTabRender(); if(CL.tab==='text' && !CL.texts.length) addText(); });
  const box=$('#colTab'); const t=CL.tab; let h='';
  $('#colHint').textContent = CL.mode==='free' ? '끌기 = 이동 · 두 손가락 = 크기·각도 · 사진 두 번 탭 = 메뉴 · 글자 탭 = 수정' : '빈 칸 탭 = 사진 넣기 · 끌기 = 위치 · 두 손가락 = 확대 · 글자 탭 = 수정';
  if(t==='layout'){
    const rect=Object.entries(COL_LAYOUTS).filter(([k])=>!k.startsWith('d')), diag=Object.entries(COL_LAYOUTS).filter(([k])=>k.startsWith('d'));
    h=`<div class="desc">기본</div><div class="lrow">${rect.map(([k,p])=>layoutIcon(k,p)).join('')}</div><div class="desc" style="margin-top:4px">대각선</div><div class="lrow">${diag.map(([k,p])=>layoutIcon(k,p)).join('')}</div>`;
  } else if(t==='free'){
    h=`<div class="desc">사진을 자유롭게 배치해요. 끌어서 옮기고, 두 손가락으로 크기와 각도를 바꿔요.</div>
       <div class="miniBtns"><button id="frAdd" class="primary">🖼 사진 추가</button><button id="frShuffle">🔀 흩뿌리기</button><button id="frStraight">↺ 바로 세우기</button></div>
       ${rngC('frame','사진 흰 테두리',0,30)}`;
  } else if(t==='border'){
    h = CL.mode==='grid'
      ? `${rngC('gap','여백',0,40)}${rngC('seam','불투명',0,100)}
         <div class="desc">불투명을 올리면 사진 사이 경계가 뿌옇게 섞여 한 장처럼 이어져요. (여백은 자동으로 없어져요)</div>
         <div class="miniBtns"><button id="noGap" class="${CL.gap===0&&!CL.seam?'on':''}">여백 없애기</button><button id="seamOn" class="${CL.seam>0?'on':''}">불투명</button><button id="midGap" class="${CL.gap===10&&!CL.seam?'on':''}">기본 여백</button></div>`
      : `${rngC('frame','사진 흰 테두리',0,30)}<div class="miniBtns"><button id="noGap" class="${CL.frame===0?'on':''}">테두리 없애기</button><button id="midGap">기본 테두리</button></div>`;
  } else if(t==='ratio'){
    h=`<div class="opts">${COL_RATIOS.map(([v,l])=>`<button class="chip ${CL.ratio===v?'on':''}" data-r="${v}">${l}</button>`).join('')}</div>`;
  } else if(t==='bg'){
    h=`<div class="colorRow">${COL_BG.map(c=>`<button class="sw ${CL.bg===c?'on':''}" style="background:${c}" data-b="${c}"></button>`).join('')}<input type="color" id="cBg" value="${CL.bg}"></div>`;
  } else if(t==='text'){
    h=`<div class="miniBtns" style="margin-top:0"><button id="txAdd" class="primary">＋ 글자 추가</button></div>
       ${CL.texts.length?`<div class="desc" style="margin-top:8px">넣은 글자 (눌러서 수정)</div><div class="opts">${CL.texts.map((x,i)=>`<button class="chip" data-tx="${i}" style="font-family:${fontCss(x.font)}">${esc((x.text||' ').split('\n')[0].slice(0,12))}</button>`).join('')}</div>`:''}`;
  }
  box.innerHTML=h;
  box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ CL.layout=b.dataset.l; setColMode('grid'); colTabRender(); });
  box.querySelectorAll('input[data-c]').forEach(r=>{ r.oninput=()=>{ CL[r.dataset.c]=+r.value; r.nextElementSibling.textContent=r.value; colDraw(); }; r.onchange=()=>{ if(CL.tab==='border') colTabRender(); }; });
  box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ CL.ratio=b.dataset.r; colTabRender(); colLayout(); });
  box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ CL.bg=b.dataset.b; colTabRender(); colDraw(); });
  box.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{ CL.sel=+b.dataset.tx; colDraw(); textSheet(+b.dataset.tx); });
  const q=s=>box.querySelector(s);
  if(q('#cBg')) q('#cBg').oninput=e=>{ CL.bg=e.target.value; colDraw(); };
  if(q('#noGap')) q('#noGap').onclick=()=>{ if(CL.mode==='grid'){ CL.gap=0; CL.seam=0; } else CL.frame=0; colTabRender(); colDraw(); };
  if(q('#midGap')) q('#midGap').onclick=()=>{ if(CL.mode==='grid'){ CL.gap=10; CL.seam=0; } else CL.frame=4; colTabRender(); colDraw(); };
  if(q('#seamOn')) q('#seamOn').onclick=()=>{ CL.seam=CL.seam||50; colTabRender(); colDraw(); };
  if(q('#frAdd')) q('#frAdd').onclick=()=>colPick(-1);
  if(q('#frShuffle')) q('#frShuffle').onclick=()=>{ CL.items.forEach(it=>{ it.x=0.22+Math.random()*0.56; it.y=0.22+Math.random()*0.56; it.rot=(Math.random()-0.5)*0.4; }); colDraw(); };
  if(q('#frStraight')) q('#frStraight').onclick=()=>{ CL.items.forEach(it=>it.rot=0); colDraw(); };
  if(q('#txAdd')) q('#txAdd').onclick=addText;
}
function resetCollage(){
  Object.assign(CL,{mode:'grid',layout:'2h',ratio:'4:5',seam:0,gap:10,frame:4,bg:'#ffffff',cells:[],items:[],texts:[],sel:-1,selItem:-1,tab:'layout'});
  colEnsureCells(); colTabRender(); colLayout();
}
function setColMode(m){
  if(m==='free' && !CL.items.length){ CL.cells.forEach(c=>{ if(c&&c.img) colAddItem(c.img); }); }
  if(m==='grid' && CL.mode==='free' && !CL.cells.some(c=>c&&c.img) && CL.items.length){ colEnsureCells(); CL.items.forEach((it,i)=>{ if(i<CL.cells.length) CL.cells[i]={img:it.img,z:1,cx:it.img.width/2,cy:it.img.height/2}; }); }
  CL.mode=m; CL.selItem=-1; colLayout();
}
async function colSave(){
  const has = CL.mode==='grid' ? CL.cells.some(c=>c&&c.img) : CL.items.length;
  if(!has && !CL.texts.length){ toast('먼저 사진을 넣어 주세요'); return; }
  for(const t of CL.texts) await colEnsureFont(t);
  const a=colRatio(), long=2000; const W=Math.round(a>=1?long:long*a), H=Math.round(a>=1?long/a:long);
  const cv=newMask(W,H); colRender(cv.getContext('2d'),W,H,true);
  showResult([{blob:await toBlob(cv,'image/jpeg',0.93), name:`collage_${stamp()}.jpg`}]);
}
$('#colSave').onclick=colSave;

/* ========== 17. 앱 설치 · 시작 ========== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('#installBtn').classList.remove('hidden'); });
$('#installBtn').onclick=async()=>{
  const guide=()=>toast('크롬 오른쪽 위 ⋮ → "홈 화면에 추가" 또는 "앱 설치"를 눌러 주세요', 5000);
  if(!deferredPrompt) return guide();
  try{ await deferredPrompt.prompt(); const c=await deferredPrompt.userChoice; if(c && c.outcome==='accepted') $('#installBtn').classList.add('hidden'); }catch(e){ guide(); }
  deferredPrompt=null;
};
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('resize',()=>{ layout(); if(camOn) layoutCam(); colLayout(); edFit(); });
window.addEventListener('orientationchange',()=>setTimeout(()=>{ layout(); if(camOn) layoutCam(); colLayout(); edFit(); },300));
document.addEventListener('visibilitychange',()=>{ if(document.hidden && camOn) stopStream(); else if(!document.hidden && camOn && !stream) startStream(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ drawAll(); colDraw(); });
history.replaceState({s:'home'},'');
updateSeg(); renderProcSeg(); renderGuideChips(); buildSlots(); colEnsureCells(); colTabRender(); edPanel();
</script>
</body>
