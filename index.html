<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="비포애프터">
<title>비포&amp;애프터 구도 가이드</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg:#0e0f11; --panel:#181a1e; --panel2:#22252b; --line:#2e3138;
  --text:#f2f2f2; --sub:#9aa0a8; --accent:#ff7a1a; --accent2:#ffa45c;
  --ok:#3ddc84; --warn:#ffcc33; --bad:#ff5a5a;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:56px}
header h1{flex:1;margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 b{color:var(--accent)}
.icon-btn{min-width:46px;height:46px;border-radius:14px;background:var(--panel2);font-size:20px;display:flex;align-items:center;justify-content:center;padding:0 10px}
.icon-btn.accent{background:var(--accent);color:#111;font-weight:800;font-size:15px}
.row{display:flex;gap:8px;padding:0 10px}
.seg{display:flex;background:var(--panel);border-radius:14px;padding:4px;flex:1}
.seg button{flex:1;height:44px;border-radius:11px;background:transparent;font-size:15px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--accent);color:#111}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:42px;padding:0 15px;border-radius:21px;background:var(--panel2);font-size:15px;font-weight:700;color:#ddd;white-space:nowrap}
.chip.on{background:var(--accent);color:#111}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;margin:6px 10px;min-height:0}
#compose{position:relative;display:flex;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#compose.tb{flex-direction:column}
.slot{position:relative;overflow:hidden;background:#0a0b0c}
.slot canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.slot .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:repeating-linear-gradient(45deg,#121417,#121417 10px,#15171b 10px,#15171b 20px);font-size:15px;color:var(--sub);font-weight:700;width:100%}
.slot .empty .plus{width:54px;height:54px;border-radius:50%;border:2px dashed var(--accent);color:var(--accent);font-size:30px;display:flex;align-items:center;justify-content:center}
.slot .empty b{color:var(--text);font-size:17px}
.slot .tag{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55);color:var(--accent2);pointer-events:none}
.slot .menu{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.6);font-size:20px;color:#fff}
#textLayer{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;padding:6px 10px}
.actions4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 10px}
.big{height:60px;border-radius:16px;background:var(--panel2);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.big.primary{background:var(--accent);color:#111}
.actions4 .big{height:58px;font-size:14px;flex-direction:column;gap:2px}
.actions4 .big span{font-size:20px}
.hintline{font-size:12px;color:var(--sub);text-align:center;padding:2px 10px}
footer{text-align:center;font-size:13px;color:var(--sub);padding:6px 0 8px}
footer a{color:var(--accent);text-decoration:none;font-weight:700}
/* home */
#home{overflow-y:auto}
.hero{padding:18px 18px 6px}
.hero small{display:block;color:var(--accent2);font-weight:800;font-size:13px;letter-spacing:1px}
.hero h2{margin:6px 0 4px;font-size:27px;line-height:1.25;letter-spacing:-.6px}
.hero h2 b{color:var(--accent)}
.hero p{margin:0;color:var(--sub);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.tile{position:relative;border-radius:22px;padding:18px 16px;min-height:150px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;color:#fff}
.tile .ico{position:absolute;top:14px;left:14px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:30px}
.tile b{font-size:21px;font-weight:900}
.tile span{font-size:13px;opacity:.9;line-height:1.35}
.tile.wide{grid-column:1/3;min-height:170px;background:linear-gradient(135deg,#ff7a1a,#ff4f6d)}
.tile.col{background:linear-gradient(135deg,#7b5cff,#c35cff)}
.tile.edt{background:linear-gradient(135deg,#1fb6a6,#2f7bff)}
.tile.wide .ico{width:64px;height:64px;font-size:36px}
.homeRow{display:flex;gap:10px;padding:0 16px}
.homeRow .big{flex:1;height:52px;font-size:15px}
/* procedure */
.procSeg button{font-size:15px}
/* camera */
#cam{background:#000}
#camStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;margin:4px 0}
#camFrame{position:relative;background:#050505;overflow:hidden}
#camFrame canvas,#camFrame video{position:absolute;inset:0;width:100%;height:100%;display:block}
#camBefore{pointer-events:none}
#camGuides{pointer-events:none}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;background:rgba(0,0,0,.7);border:1px solid rgba(255,122,26,.6);padding:8px 14px;border-radius:20px;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#match{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);padding:6px 12px;border-radius:14px;font-weight:900;font-size:22px;text-align:center;line-height:1.05}
#match small{display:block;font-size:11px;font-weight:700;color:var(--sub)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#camFallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:rgba(0,0,0,.88);z-index:3}
#camFallback p{margin:0;font-size:15px;line-height:1.5;color:#ddd}
#camFallback .big{width:100%;max-width:340px}
.camctrl{padding:4px 0 6px;background:#000}
.sliderRow{display:flex;align-items:center;gap:10px;padding:2px 14px;font-size:13px;color:var(--sub)}
.sliderRow input{flex:1}
.presetRow{display:flex;gap:6px;padding:4px 10px}
.pchip{flex:1;height:48px;border-radius:12px;background:var(--panel2);font-size:14px;font-weight:800;line-height:1.1}
.pchip small{font-size:10px;font-weight:600;color:var(--sub)}
.pchip.on{background:var(--accent);color:#111}.pchip.on small{color:#111}
.pchip.peek{background:#2b2015;border:1px solid var(--accent);color:var(--accent2);user-select:none;-webkit-user-select:none;touch-action:none}
.shutterRow{display:flex;align-items:center;justify-content:space-around;padding:6px 10px 4px}
#shutter{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #000,0 0 0 9px var(--accent);position:relative}
.side{width:64px;height:56px;border-radius:16px;background:var(--panel2);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.side span{font-size:20px}
input[type=range]{accent-color:var(--accent);height:30px}
/* edit */
#edStage,#colStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;margin:6px 10px;min-height:0}
#edCanvas{max-width:100%;max-height:100%;display:block;touch-action:none;border-radius:6px;background:repeating-conic-gradient(#2a2d33 0% 25%,#1c1e22 0% 50%) 50%/22px 22px;box-shadow:0 0 0 1px var(--line)}
#edEmpty{position:absolute;inset:0;margin:auto;width:min(80%,320px);height:180px;border-radius:20px;border:2px dashed var(--accent);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:800;color:var(--text)}
#edEmpty span{font-size:40px;color:var(--accent)}
#edBusy{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid var(--accent);padding:7px 14px;border-radius:16px;font-size:14px;font-weight:800;white-space:nowrap}
#edCompare{position:absolute;right:8px;bottom:8px;height:40px;padding:0 14px;border-radius:12px;background:rgba(0,0,0,.65);font-size:14px;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:none}
#edPanel{padding:2px 14px 8px;min-height:150px;max-height:34vh;overflow-y:auto}
#edPanel .desc{font-size:13px;color:var(--sub);margin:2px 0 6px;line-height:1.45}
.field{display:flex;align-items:center;gap:10px;font-size:14px;color:#ddd;margin:4px 0}
.field label{width:78px;flex:0 0 auto;font-weight:700}
.field input[type=range]{flex:1}
.field .val{width:40px;text-align:right;color:var(--accent2);font-size:14px;font-weight:800}
.miniBtns{display:flex;gap:8px;margin-top:6px}
.miniBtns button{flex:1;height:42px;border-radius:12px;background:var(--panel2);font-size:14px;font-weight:800}
.miniBtns button.on{background:var(--accent);color:#111}
/* collage */
#colCanvas{display:block;touch-action:none;box-shadow:0 0 0 1px var(--line);border-radius:4px}
.lchip{flex:0 0 auto;width:58px;height:58px;border-radius:14px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.lchip.on{background:var(--accent)}
.lchip svg{width:40px;height:40px}
.fontGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:30vh;overflow-y:auto;padding:2px}
.fontGrid button{height:54px;border-radius:12px;background:var(--panel2);font-size:19px;line-height:1.1;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fontGrid button small{display:block;font:600 10px var(--font);color:var(--sub)}
.fontGrid button.on{background:var(--accent);color:#111}.fontGrid button.on small{color:#111}
.colorRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.colorRow input[type=color]{width:42px;height:42px;border:0;background:none;padding:0}
/* sheets */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 12px;font-size:19px;display:flex;align-items:center;justify-content:space-between}
.sheet h2 button{background:var(--panel2);width:40px;height:40px;border-radius:12px;font-size:18px}
.sheet h3{font-size:14px;color:var(--accent2);margin:16px 0 8px}
.sheet .list{display:flex;flex-direction:column;gap:8px}
.sheet .list .big{justify-content:flex-start;padding:0 18px;text-align:left}
.sheet .list .big{flex-wrap:wrap;align-content:center;row-gap:2px;height:auto;min-height:60px;padding:8px 18px}
.sheet .list .big small{display:block;width:100%;font-size:12px;font-weight:600;color:var(--sub)}
.sheet .list .big.primary small{color:#3a1d05}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts .chip{height:44px}
textarea{width:100%;min-height:64px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:16px var(--font);resize:vertical}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:15px;border-bottom:1px solid var(--line)}
.toggle input{width:24px;height:24px;accent-color:var(--accent)}
.preview{width:100%;max-height:42vh;object-fit:contain;background:repeating-conic-gradient(#2a2d33 0% 25%,#1c1e22 0% 50%) 50%/20px 20px;border-radius:12px;display:block}
.previews{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.previews figure{margin:0;text-align:center;font-size:12px;font-weight:800;color:var(--accent2)}
.previews img{width:100%;height:28vh;object-fit:contain;background:#000;border-radius:10px;display:block;margin-bottom:4px}
.help p,.help li{font-size:14px;line-height:1.6;color:#ddd}
.help ul{padding-left:18px;margin:6px 0}
.help b{color:var(--accent2)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(30,30,30,.95);border:1px solid var(--accent);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===== 홈(메뉴) 화면 ===== -->
<div id="home" class="screen">
  <header>
    <h1>📸 비포<b>&amp;</b>애프터</h1>
    <button class="icon-btn accent hidden" id="installBtn">설치</button>
    <button class="icon-btn" id="helpBtn" aria-label="사용법">❓</button>
    <button class="icon-btn" id="setBtn" aria-label="설정">⚙️</button>
  </header>
  <div class="hero">
    <small>BEAUTY BY BIN</small>
    <h2>시술 전후,<br><b>같은 구도</b>로 정확하게</h2>
    <p>원하는 메뉴를 골라 주세요</p>
  </div>
  <div class="tiles">
    <button class="tile wide" id="goShoot"><div class="ico">📷</div><b>촬영</b><span>시술 종류에 맞는 구도로<br>비포·애프터를 같은 각도로 찍어요</span></button>
    <button class="tile col" id="goCollage"><div class="ico">🧩</div><b>콜라주</b><span>여러 장을 한 장으로<br>글자도 넣어요</span></button>
    <button class="tile edt" id="goEdit"><div class="ico">🎨</div><b>편집</b><span>부위별 피부 보정<br>얼굴·배경 편집</span></button>
  </div>
  <div style="flex:1"></div>
  <footer>제작자 인스타 <a href="https://www.instagram.com/beautyby_bin/" target="_blank" rel="noopener">@beautyby_bin</a></footer>
</div>

<!-- ===== 촬영(비교) 화면 ===== -->
<div id="main" class="screen hidden">
  <header>
    <button class="icon-btn" data-home aria-label="홈으로">←</button>
    <h1>📷 촬영</h1>
    <button class="icon-btn" id="swapBtn" aria-label="비포·애프터 바꾸기">⇄</button>
  </header>
  <div class="row"><div class="seg procSeg" id="procSeg"></div></div>
  <div class="row" style="padding-top:8px"><div class="seg" id="layoutSeg">
      <button data-v="tb">⬆⬇ 위·아래</button>
      <button data-v="lr">⬅➡ 왼쪽·오른쪽</button>
  </div></div>
  <div id="stage">
    <div id="compose">
      <div class="slot" data-i="0"></div>
      <div class="slot" data-i="1"></div>
      <canvas id="textLayer"></canvas>
    </div>
  </div>
  <div class="hintline">두 손가락으로 벌리기/오므리기 = 확대/축소 · 한 손가락으로 끌기 = 위치 이동 · 두 번 탭 = 원래대로</div>
  <div class="chips guideToggle" id="guideChipsMain"></div>
  <div class="row"><button class="big primary" id="alignBtn" style="flex:1">🎯 비포 사진에 맞춰 애프터 찍기</button></div>
  <div class="actions">
    <button class="big" id="camBtn">📷 카메라</button>
    <button class="big" id="galBtn">🖼 갤러리</button>
    <button class="big primary" id="saveBtn">💾 저장</button>
  </div>
</div>

<!-- ===== 카메라 화면 ===== -->
<div id="cam" class="screen hidden">
  <header>
    <button class="icon-btn" id="camClose" aria-label="닫기">✕</button>
    <h1 id="camTitle" style="text-align:center">촬영</h1>
    <button class="icon-btn" id="camFlip" aria-label="카메라 전환">🔄</button>
  </header>
  <div id="camStage">
    <div id="camFrame">
      <canvas id="liveGL"></canvas>
      <canvas id="camBefore"></canvas>
      <canvas id="camGuides"></canvas>
      <div id="hint" class="hidden"></div>
      <div id="match" class="hidden">--%<small>매칭률</small></div>
      <div id="flash"></div>
      <div id="camFallback" class="hidden">
        <p id="camErrMsg">실시간 카메라를 열 수 없어요.</p>
        <button class="big primary" id="nativePhoto">📱 휴대폰 기본 카메라로 사진 찍기</button>
        <button class="big" id="retryCam">🔁 실시간 카메라 다시 시도</button>
      </div>
    </div>
  </div>
  <div class="camctrl">
    <div id="overlayRow">
      <div class="sliderRow"><span>비포 투명도</span><input type="range" id="overlayRange" min="0" max="100" value="40"><span id="overlayVal">40%</span></div>
      <div class="presetRow">
        <button class="pchip" data-o="0">0%<br><small>애프터만</small></button>
        <button class="pchip" data-o="30">30%</button>
        <button class="pchip" data-o="50">50%</button>
        <button class="pchip" data-o="70">70%</button>
        <button class="pchip" data-o="100">100%<br><small>비포만</small></button>
        <button class="pchip peek" id="peekBtn">👁 꾹<br><small>비포 확인</small></button>
      </div>
    </div>
    <div class="chips guideToggle" id="guideChipsCam"></div>
    <div class="shutterRow">
      <button class="side" id="camSmooth"><span>✨</span>보정</button>
      <button id="shutter" aria-label="촬영"></button>
      <button class="side" id="camGal"><span>🖼</span>갤러리</button>
    </div>
  </div>
</div>

<!-- ===== 편집 화면 ===== -->
<div id="edit" class="screen hidden">
  <header>
    <button class="icon-btn" data-home aria-label="홈으로">←</button>
    <h1>🎨 편집</h1>
    <button class="icon-btn" id="edOpen" aria-label="사진 불러오기">🖼</button>
    <button class="icon-btn" id="edReset" aria-label="처음으로">↺</button>
    <button class="icon-btn accent" id="edSave">저장</button>
  </header>
  <div class="row"><div class="seg procSeg" id="edProc"></div></div>
  <div id="edStage">
    <canvas id="edCanvas" class="hidden"></canvas>
    <button id="edEmpty"><span>＋</span>편집할 사진 불러오기</button>
    <div id="edBusy" class="hidden">처리 중…</div>
    <button id="edCompare" class="hidden">👁 원본</button>
  </div>
  <div class="chips" id="edTools"></div>
  <div id="edPanel"></div>
</div>

<!-- ===== 콜라주 화면 ===== -->
<div id="collage" class="screen hidden">
  <header>
    <button class="icon-btn" data-home aria-label="홈으로">←</button>
    <h1>🧩 콜라주</h1>
    <button class="icon-btn accent" id="colSave">저장</button>
  </header>
  <div class="chips" id="colLayouts"></div>
  <div id="colStage"><canvas id="colCanvas"></canvas></div>

<script>
'use strict';
/* =========================================================
   1. 설정값 (휴대폰에 자동 저장)
   ========================================================= */
const DEF = {
  layout:'tb', ratio:'4:5', proc:'brow', guideOn:true,
  color:'#ffffff', opacity:70, width:2,
  smooth:45, overlay:40,
  text:'', textPos:'bottom', textSize:6, textColor:'#ffffff',
  labels:false
};
let S = Object.assign({}, DEF);
try{ Object.assign(S, JSON.parse(localStorage.getItem('bacam-settings')||'{}')); }catch(e){}
if(!['brow','lash','body'].includes(S.proc)) S.proc='brow';
function saveS(){ try{ localStorage.setItem('bacam-settings', JSON.stringify(S)); }catch(e){} }

const PROCS = [['brow','✏️ 눈썹','눈썹'],['lash','👁 속눈썹','속눈썹'],['body','🧍 바디','바디']];
const procName = p => (PROCS.find(x=>x[0]===p)||PROCS[0])[2];
const RATIOS = [['free','자유'],['1:1','1:1'],['4:5','4:5'],['16:9','16:9'],['9:16','9:16']];
const COLORS = [['#ffffff','흰색'],['#000000','검정'],['#ff7a1a','주황']];

const $ = s => document.querySelector(s);
const dpr = () => Math.min(window.devicePixelRatio||1, 3);
function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =========================================================
   2. 카메라 미리보기 피부 보정 (WebGL 셰이더)
   ========================================================= */
const VS = `attribute vec2 p;varying vec2 v;uniform vec4 crop;uniform float mirror;
void main(){vec2 uv=vec2(p.x*0.5+0.5,0.5-p.y*0.5);if(mirror>0.5)uv.x=1.0-uv.x;v=crop.xy+uv*crop.zw;gl_Position=vec4(p,0.0,1.0);}`;
const FS = `precision mediump float;varying vec2 v;uniform sampler2D t;uniform vec2 texel;uniform float stepv;uniform float strength;
float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
float skin(vec3 c){float y=luma(c);
 float cb=0.5-0.168736*c.r-0.331264*c.g+0.5*c.b;float cr=0.5+0.5*c.r-0.418688*c.g-0.081312*c.b;
 float m=smoothstep(0.26,0.30,cb)*(1.0-smoothstep(0.50,0.54,cb));
 m*=smoothstep(0.50,0.54,cr)*(1.0-smoothstep(0.69,0.73,cr));
 m*=smoothstep(0.10,0.22,y);return m;}
void main(){vec3 c0=texture2D(t,v).rgb;
 if(strength<0.001){gl_FragColor=vec4(c0,1.0);return;}
 float l0=luma(c0);vec3 sum=vec3(0.0);float ws=0.0;float dark=0.0;
 for(int i=-2;i<=2;i++){for(int j=-2;j<=2;j++){
  vec2 o=vec2(float(i),float(j))*texel*stepv;vec3 c=texture2D(t,v+o).rgb;vec3 d=c-c0;
  float w=exp(-dot(d,d)*55.0);sum+=c*w;ws+=w;dark+=step(luma(c),l0*0.70);}}
 for(int k=0;k<8;k++){float a=float(k)*0.7854;vec2 o=vec2(cos(a),sin(a))*texel*stepv*4.5;
  vec3 c=texture2D(t,v+o).rgb;dark+=step(luma(c),l0*0.68)*1.5;}
 vec3 sm=sum/ws;float protect=1.0-smoothstep(1.0,4.0,dark);
 float m=skin(c0)*protect*strength;vec3 oc=mix(c0,sm,m);
 oc=oc+vec3(0.03,0.025,0.025)*m*0.7;
 gl_FragColor=vec4(clamp(oc,0.0,1.0),1.0);}`;

class Smoother{
  constructor(canvas, preserve){
    this.c = canvas; this.gl = null;
    try{ this.gl = canvas.getContext('webgl',{preserveDrawingBuffer:!!preserve,antialias:false,premultipliedAlpha:false}) || canvas.getContext('experimental-webgl'); }catch(e){}
    const gl=this.gl; if(!gl) return;
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));} return s;};
    const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ console.warn('GL link fail'); this.gl=null; return; }
    gl.useProgram(pr); this.pr=pr;
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    this.tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,this.tex);
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    this.u={}; ['crop','mirror','texel','stepv','strength'].forEach(n=>this.u[n]=gl.getUniformLocation(pr,n));
    this.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE)||4096;
  }
  ok(){ return !!this.gl; }
  render(src, srcW, srcH, crop, outW, outH, strength, mirror){
    const gl=this.gl; if(!gl) return false;
    if(this.c.width!==outW) this.c.width=outW;
    if(this.c.height!==outH) this.c.height=outH;
    gl.viewport(0,0,outW,outH);
    gl.bindTexture(gl.TEXTURE_2D,this.tex);
    try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src); }catch(e){ return false; }
    gl.uniform4f(this.u.crop, crop.x/srcW, crop.y/srcH, crop.w/srcW, crop.h/srcH);
    gl.uniform1f(this.u.mirror, mirror?1:0);
    gl.uniform2f(this.u.texel, 1/srcW, 1/srcH);
    const outLong=Math.max(outW,outH);
    gl.uniform1f(this.u.stepv, Math.max(1,(crop.w/outW)*(outLong/420)));
    gl.uniform1f(this.u.strength, strength);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    return true;
  }
}
const imgGLCanvas = document.createElement('canvas');
const imgSmoother = new Smoother(imgGLCanvas, true);
const liveSmoother = new Smoother($('#liveGL'), false);
const strengthVal = () => Math.min(1, S.smooth/100*0.9);

/* =========================================================
   3. 사진 칸(BEFORE / AFTER) 관리
   ========================================================= */
const slots = [
  {name:'BEFORE', orig:null, proc:null, z:1, cx:0, cy:0},
  {name:'AFTER',  orig:null, proc:null, z:1, cx:0, cy:0}
];
let slotW=100, slotH=100;

function ratioNum(){ if(S.ratio==='free') return null; const [a,b]=S.ratio.split(':').map(Number); return a/b; }
function slotAspect(){ return ratioNum() || (slotW/slotH); }

function cropFor(iw, ih, z, cx, cy, aspect){
  let w0,h0; if(iw/ih > aspect){ h0=ih; w0=ih*aspect; } else { w0=iw; h0=iw/aspect; }
  const w=w0/z, h=h0/z;
  return {x:cx-w/2, y:cy-h/2, w, h};
}
function cropOf(s, aspect){ return cropFor(s.proc.width, s.proc.height, s.z, s.cx, s.cy, aspect); }
function clampSlot(s){
  if(!s.proc) return;
  s.z=Math.max(1,Math.min(10,s.z));
  const c=cropOf(s, slotAspect());
  s.cx=Math.max(c.w/2, Math.min(s.proc.width-c.w/2, s.cx));
  s.cy=Math.max(c.h/2, Math.min(s.proc.height-c.h/2, s.cy));
}
function resetView(s){ if(!s.proc) return; s.z=1; s.cx=s.proc.width/2; s.cy=s.proc.height/2; }

function processSlot(s){
  if(!s.orig){ s.proc=null; return; }
  const st=strengthVal();
  if(st<=0 || !imgSmoother.ok()){ s.proc=s.orig; return; }
  const w=s.orig.width, h=s.orig.height;
  const ok=imgSmoother.render(s.orig,w,h,{x:0,y:0,w,h},w,h,st,false);
  if(!ok){ s.proc=s.orig; return; }
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(imgGLCanvas,0,0);
  s.proc=c;
}
function toCanvas(src, sw, sh, maxSide){
  maxSide=maxSide||Math.min(2400, imgSmoother.ok()?imgSmoother.maxTex:2400);
  const k=Math.min(1, maxSide/Math.max(sw,sh));
  const c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height);
  return c;
}
function loadFile(file, maxSide){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const c=toCanvas(im,im.naturalWidth,im.naturalHeight,maxSide); URL.revokeObjectURL(url); res(c); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 열 수 없어요')); };
    im.src=url;
  });
}
function setSlotImage(i, canvas){
  const s=slots[i]; s.orig=canvas; processSlot(s); resetView(s);
  buildSlots(); drawAll();
}
async function setSlotFile(i, file){
  try{ setSlotImage(i, await loadFile(file)); }
  catch(e){ toast('사진을 불러오지 못했어요. 다른 사진으로 해 보세요.'); }
}
function firstEmpty(){ return slots[0].proc? (slots[1].proc? -1 : 1) : 0; }

/* =========================================================
   4. 구도선 (기본 2분할 + 시술별 위치 표시)
   ========================================================= */
function drawGuides(ctx, w, h, scale){
  if(!S.guideOn) return;
  ctx.save();
  ctx.strokeStyle=S.color; ctx.fillStyle=S.color;
  ctx.globalAlpha=S.opacity/100; ctx.lineWidth=S.width*scale;
  ctx.shadowColor = S.color==='#000000' ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.45)';
  ctx.shadowBlur = 2*scale;
  const L=(x1,y1,x2,y2,dash)=>{ ctx.setLineDash(dash?[8*scale,7*scale]:[]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  // 기본 2분할
  L(w/2,0,w/2,h); L(0,h/2,w,h/2);
  // 시술별 위치 표시 (점선)
  ctx.globalAlpha=S.opacity/100*0.85; ctx.lineWidth=S.width*scale*0.9;
  ctx.setLineDash([7*scale,6*scale]);
  const fam=getComputedStyle(document.body).fontFamily;
  const label=(t,x,y)=>{ ctx.save(); ctx.setLineDash([]); ctx.globalAlpha=Math.min(1,S.opacity/100+0.15); ctx.font=`800 ${Math.max(11,Math.min(w,h)*0.035)}px ${fam}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y); ctx.restore(); };
  if(S.proc==='brow'){
    const y=h*0.40; L(0,y,w,y,true);
    // 왼쪽·오른쪽 눈썹 모양 (앞머리는 가운데 쪽, 꼬리는 바깥쪽)
    [[1,0.43,0.10],[-1,0.57,0.90]].forEach(([dir,head,tail])=>{
      ctx.beginPath();
      ctx.moveTo(w*head, y+h*0.015);
      ctx.quadraticCurveTo(w*(head-dir*0.10), y-h*0.07, w*(tail+dir*0.03), y-h*0.035);
      ctx.quadraticCurveTo(w*tail, y-h*0.02, w*tail, y+h*0.01);
      ctx.stroke();
    });
    label('눈썹 라인', w*0.5, y-h*0.085);
  } else if(S.proc==='lash'){
    const y=h*0.5, ew=w*0.30, eh=Math.min(h*0.10, ew*0.38);
    [0.27,0.73].forEach(cx=>{
      ctx.beginPath();
      ctx.moveTo(w*cx-ew/2, y);
      ctx.quadraticCurveTo(w*cx, y-eh*1.25, w*cx+ew/2, y);
      ctx.quadraticCurveTo(w*cx, y+eh*0.9, w*cx-ew/2, y);
      ctx.stroke();
    });
    label('눈 위치', w*0.5, y-eh*1.6);
  } else {
    const m=Math.min(w,h)*0.08, r=Math.min(w,h)*0.05;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(m,m,w-2*m,h-2*m,r); else ctx.rect(m,m,w-2*m,h-2*m);
    ctx.stroke();
    label('시술 부위를 이 안에', w*0.5, m+Math.min(w,h)*0.05);
  }
  ctx.restore();
}

/* 글자·라벨 (촬영 저장 사진에 들어감) */
function drawTextOverlay(ctx, W, H, rects){
  const fam=getComputedStyle(document.body).fontFamily;
  if(S.labels && rects){
    rects.forEach(r=>{
      const fs=Math.max(10, Math.min(r.w,r.h)*0.055);
      ctx.save(); ctx.font=`800 ${fs}px ${fam}`; ctx.textBaseline='top';
      const tw=ctx.measureText(r.name).width, pad=fs*0.45;
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(r.x+fs*0.6, r.y+fs*0.6, tw+pad*2, fs+pad*1.4);
      ctx.fillStyle='#ffffff'; ctx.fillText(r.name, r.x+fs*0.6+pad, r.y+fs*0.6+pad*0.75);
      ctx.restore();
    });
  }
  const txt=(S.text||'').trim(); if(!txt) return;
  const lines=txt.split('\n'); const fs=Math.min(W,H)*S.textSize/100;
  ctx.save(); ctx.font=`700 ${fs}px ${fam}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=S.textColor; ctx.shadowColor=S.textColor==='#000000'?'rgba(255,255,255,.7)':'rgba(0,0,0,.7)'; ctx.shadowBlur=fs*0.25;
  const lh=fs*1.25, total=lh*lines.length;
  let y0 = S.textPos==='center' ? H/2-total/2+lh/2 : H-total-fs*0.4+lh/2;
  if(S.textPos==='top') y0=fs*0.6+lh/2;
  lines.forEach((l,k)=>ctx.fillText(l, W/2, y0+k*lh));
  ctx.restore();
}

/* =========================================================
   5. 촬영 화면 그리기
   ========================================================= */
const compose=$('#compose');
function buildSlots(){
  document.querySelectorAll('.slot').forEach(el=>{
    const i=+el.dataset.i, s=slots[i];
    let cv=el.querySelector('canvas');
    if(!cv){ cv=document.createElement('canvas'); el.appendChild(cv); attachGestures(cv,i);
      const tag=document.createElement('div'); tag.className='tag'; el.appendChild(tag);
      const mb=document.createElement('button'); mb.className='menu'; mb.textContent='⋯'; mb.onclick=()=>slotMenu(i); el.appendChild(mb);
      const em=document.createElement('button'); em.className='empty'; em.onclick=()=>slotMenu(i); el.appendChild(em);
    }
    el.querySelector('.tag').textContent=s.name;
    el.querySelector('.tag').classList.toggle('hidden', S.labels);
    const em=el.querySelector('.empty');
    em.innerHTML=`<div class="plus">+</div><b>${s.name}</b>${i===0?'시술 전 사진 넣기':'시술 후 사진 넣기'}`;
    em.classList.toggle('hidden', !!s.proc);
    el.querySelector('.menu').classList.toggle('hidden', !s.proc);
  });
}
function layout(){
  const st=$('#stage'); const W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;
  const r=ratioNum(); const lr=S.layout==='lr';
  compose.classList.toggle('tb', !lr);
  if(lr){ if(r){ slotW=Math.min(W/2, H*r); slotH=slotW/r; } else { slotW=W/2; slotH=H; } }
  else { if(r){ slotH=Math.min(H/2, W/r); slotW=slotH*r; } else { slotW=W; slotH=H/2; } }
  slotW=Math.floor(slotW); slotH=Math.floor(slotH);
  compose.style.width=(lr?slotW*2:slotW)+'px'; compose.style.height=(lr?slotH:slotH*2)+'px';
  document.querySelectorAll('.slot').forEach(el=>{ el.style.width=slotW+'px'; el.style.height=slotH+'px'; });
  slots.forEach(clampSlot);
  drawAll();
}
function drawSlot(i){
  const el=document.querySelector(`.slot[data-i="${i}"]`); const cv=el.querySelector('canvas'); const s=slots[i];
  const k=dpr(); const w=Math.round(slotW*k), h=Math.round(slotH*k);
  if(cv.width!==w) cv.width=w; if(cv.height!==h) cv.height=h;
  const x=cv.getContext('2d'); x.clearRect(0,0,w,h);
  if(!s.proc) return;
  const c=cropOf(s, slotAspect()); x.imageSmoothingQuality='high';
  x.drawImage(s.proc, c.x,c.y,c.w,c.h, 0,0,w,h);
  drawGuides(x,w,h,k);
}
function drawText(){
  const cv=$('#textLayer'); const k=dpr(); const W=compose.clientWidth, H=compose.clientHeight;
  cv.width=Math.round(W*k); cv.height=Math.round(H*k);
  const x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
  const lr=S.layout==='lr';
  const rects=slots.map((s,i)=>({name:s.name, x:lr?i*slotW*k:0, y:lr?0:i*slotH*k, w:slotW*k, h:slotH*k})).filter((r,i)=>slots[i].proc);
  drawTextOverlay(x,cv.width,cv.height,rects);
}
function drawAll(){ drawSlot(0); drawSlot(1); drawText(); }

/* 두 손가락 확대/축소, 한 손가락 이동 */
function attachGestures(cv, i){
  const pts=new Map(); let lastTap=0, moved=0;
  const scaleOf=s=>{ const c=cropOf(s,slotAspect()); return slotW/c.w; };
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; });
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return; const s=slots[i]; if(!s.proc){ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); return; }
    const prev=new Map(pts); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const rect=cv.getBoundingClientRect(); const ccx=rect.left+rect.width/2, ccy=rect.top+rect.height/2;
    if(pts.size===1){
      const p0=prev.get(e.pointerId), p1=pts.get(e.pointerId); const sc=scaleOf(s);
      s.cx-=(p1.x-p0.x)/sc; s.cy-=(p1.y-p0.y)/sc; moved+=Math.abs(p1.x-p0.x)+Math.abs(p1.y-p0.y);
    } else if(pts.size>=2){
      const ids=[...pts.keys()].slice(0,2); const a0=prev.get(ids[0]), b0=prev.get(ids[1]), a1=pts.get(ids[0]), b1=pts.get(ids[1]);
      const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1, d1=Math.hypot(a1.x-b1.x,a1.y-b1.y)||1;
      const m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2}, m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
      const sc0=scaleOf(s); const px=s.cx+(m0.x-ccx)/sc0, py=s.cy+(m0.y-ccy)/sc0;
      s.z*=d1/d0; s.z=Math.max(1,Math.min(10,s.z));
      const sc1=scaleOf(s); s.cx=px-(m1.x-ccx)/sc1; s.cy=py-(m1.y-ccy)/sc1; moved+=99;
    }
    clampSlot(s); drawSlot(i);
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if(pts.size===0 && moved<6){ const now=Date.now(); if(now-lastTap<320 && slots[i].proc){ resetView(slots[i]); drawSlot(i); } lastTap=now; }
  };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const s=slots[i]; if(!s.proc) return;
    const rect=cv.getBoundingClientRect(); const ccx=rect.left+rect.width/2, ccy=rect.top+rect.height/2;
    const sc0=scaleOf(s); const px=s.cx+(e.clientX-ccx)/sc0, py=s.cy+(e.clientY-ccy)/sc0;
    s.z*=e.deltaY<0?1.1:1/1.1; s.z=Math.max(1,Math.min(10,s.z));
    const sc1=scaleOf(s); s.cx=px-(e.clientX-ccx)/sc1; s.cy=py-(e.clientY-ccy)/sc1; clampSlot(s); drawSlot(i);
  },{passive:false});
}

function layoutCam(){
  const st=$('#camStage'); const W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;

function stopStream(){
  cancelAnimationFrame(rafId); clearInterval(analyzeTimer);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null;
}
async function startStream(){
  stopStream(); $('#camFallback').classList.add('hidden');
  $('#hint').classList.add('hidden');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return camFail('이 화면(미리보기 또는 http 주소)에서는 실시간 카메라를 쓸 수 없어요.<br>대신 휴대폰 기본 카메라로 찍을 수 있어요.');
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!camOn){ stopStream(); return; }
    video.srcObject=stream; await video.play();
    loop(); analyzeTimer=setInterval(analyzeLive,300);
  }catch(e){
    let m='실시간 카메라를 열 수 없어요.';
    if(e && (e.name==='NotAllowedError'||e.name==='SecurityError')) m='카메라 권한이 막혀 있어요.<br>주소창 옆 🔒(자물쇠) → 권한 → 카메라 “허용”으로 바꿔 주세요.';
    else if(e && e.name==='NotFoundError') m='이 기기에서 카메라를 찾지 못했어요.';
    else if(e && e.name==='NotReadableError') m='다른 앱이 카메라를 쓰고 있어요. 다른 앱을 닫고 다시 시도해 주세요.';
    camFail(m+'<br>대신 휴대폰 기본 카메라로 찍을 수 있어요.');
  }
}
function camFail(msg){
  $('#camErrMsg').innerHTML=msg; $('#camFallback').classList.remove('hidden');
  try{ $('#fileCapture').click(); }catch(e){}
}
function videoCrop(){
  const vw=video.videoWidth, vh=video.videoHeight, a=frameW/frameH;
  if(vw/vh > a){ const w=vh*a; return {x:(vw-w)/2,y:0,w,h:vh}; }
  const h=vw/a; return {x:0,y:(vh-h)/2,w:vw,h};
}
function loop(){
  rafId=requestAnimationFrame(loop);
  if(!video.videoWidth || video.readyState<2) return;
  const c=videoCrop(); const k=Math.min(1, 1080/Math.max(c.w,c.h));
  const ow=Math.round(c.w*k), oh=Math.round(c.h*k); const mirror=facing==='user';
  const lv=$('#liveGL');
  if(liveSmoother.ok()){
    liveSmoother.render(video,video.videoWidth,video.videoHeight,c,ow,oh,strengthVal(),mirror);
  } else {
    if(!lv._2d){ lv._2d=lv.getContext('2d'); }
    if(lv.width!==ow){lv.width=ow;} if(lv.height!==oh){lv.height=oh;}
    const x=lv._2d; x.save(); if(mirror){ x.translate(ow,0); x.scale(-1,1); } x.drawImage(video,c.x,c.y,c.w,c.h,0,0,ow,oh); x.restore();
  }
}

/* ---- 매칭률 & 위치 안내 ---- */
function analyze(img){
  const d=img.data, n=img.width*img.height, gray=new Float32Array(n);
  let area=0, sx=0, sy=0;
  for(let i=0;i<n;i++){
    const r=d[i*4], g=d[i*4+1], b=d[i*4+2];
    const y=0.299*r+0.587*g+0.114*b; gray[i]=y;
    const cb=128-0.168736*r-0.331264*g+0.5*b, cr=128+0.5*r-0.418688*g-0.081312*b;
    if(cb>=77&&cb<=127&&cr>=133&&cr<=173&&y>45){ area++; sx+=i%img.width; sy+=Math.floor(i/img.width); }
  }
  return {gray, area:area/n, mx: area? sx/area/img.width : 0.5, my: area? sy/area/img.height : 0.5, w:img.width, h:img.height};
}
function ncc(a,b){
  const n=a.length; let ma=0,mb=0; for(let i=0;i<n;i++){ma+=a[i];mb+=b[i];} ma/=n; mb/=n;
  let s=0,sa=0,sb=0; for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb; s+=x*y; sa+=x*x; sb+=y*y;}
  return (sa&&sb)? s/Math.sqrt(sa*sb) : 0;
}
function analyzeLive(){
  if(!camOn || !video.videoWidth) return;
  const a=frameW/frameH; const sw=48, sh=Math.max(8,Math.round(48/a));
  small.width=sw; small.height=sh;
  const c=videoCrop(); smallCtx.save();
  if(facing==='user'){ smallCtx.translate(sw,0); smallCtx.scale(-1,1); }
  smallCtx.drawImage(video,c.x,c.y,c.w,c.h,0,0,sw,sh); smallCtx.restore();
  const L=analyze(smallCtx.getImageData(0,0,sw,sh));
  const hint=$('#hint'); let msg='', front=facing==='user';
  const mv = (dir)=> front ? ({r:'➡️ 얼굴을 화면 오른쪽으로',l:'⬅️ 얼굴을 화면 왼쪽으로',u:'⬆️ 얼굴을 화면 위쪽으로',d:'⬇️ 얼굴을 화면 아래쪽으로'})[dir]
                          : ({r:'➡️ 카메라를 오른쪽으로 이동',l:'⬅️ 카메라를 왼쪽으로 이동',u:'⬆️ 카메라를 위로 이동',d:'⬇️ 카메라를 아래로 이동'})[dir];
  if(beforeStats && beforeStats.gray.length===L.gray.length){
    const B=beforeStats; const corr=Math.max(0,ncc(B.gray,L.gray));
    let pos=1;
    const skinOK = B.area>0.03 && L.area>0.03;
    if(skinOK){
      const dx=L.mx-B.mx, dy=L.my-B.my, ratio=L.area/B.area;
      pos=Math.exp(-(dx*dx+dy*dy)*25)*Math.exp(-Math.abs(Math.log(ratio))*1.6);
      if(ratio>1.2) msg='📏 촬영거리를 조금 늘리세요 (너무 가까워요)';
      else if(ratio<0.82) msg='📏 조금 더 가까이 다가가세요';
      else if(Math.abs(dx)>=Math.abs(dy) && Math.abs(dx)>0.05) msg = front ? mv(dx>0?'l':'r') : mv(dx>0?'r':'l');
      else if(Math.abs(dy)>0.05) msg = front ? mv(dy>0?'u':'d') : mv(dy>0?'d':'u');
    }
    const score=Math.round(100*(skinOK? (0.55*corr+0.45*pos) : corr));
    const m=$('#match'); m.innerHTML=`${score}%<small>매칭률</small>`;
    m.style.color = score>=80?'var(--ok)':score>=60?'var(--warn)':'var(--bad)';
    if(!msg) msg = score>=80 ? '✅ 위치가 잘 맞아요! 촬영하세요' : '비포 사진에 맞춰 천천히 움직여 보세요';
  } else {
    if(L.area>0.55 && S.proc!=='body') msg='📏 촬영거리를 조금 늘리세요 (너무 가까워요)';
    else if(L.area>0.03){
      const dx=L.mx-0.5, dy=L.my-0.5;
      if(Math.abs(dx)>=Math.abs(dy) && Math.abs(dx)>0.12) msg = front ? mv(dx>0?'l':'r') : mv(dx>0?'r':'l');
      else if(Math.abs(dy)>0.14) msg = front ? mv(dy>0?'u':'d') : mv(dy>0?'d':'u');
      else msg='✅ 구도 좋아요';
    }
  }
  hint.textContent=msg; hint.classList.toggle('hidden',!msg);
}

}

function composeImage(){
  const filled=slots.filter(s=>s.proc); if(!filled.length) return null;
  const a=slotAspect(), long=1440;
  const w=Math.round(a>=1?long:long*a), h=Math.round(a>=1?long/a:long);
  const lr=S.layout==='lr', two=filled.length===2;
  const cv=document.createElement('canvas');
  cv.width = two&&lr ? w*2 : w; cv.height = two&&!lr ? h*2 : h;
  const x=cv.getContext('2d'); x.imageSmoothingQuality='high'; x.fillStyle='#000'; x.fillRect(0,0,cv.width,cv.height);
  const rects=[];
  filled.forEach((s,k)=>{ const c=cropOf(s,a); const r={name:s.name,x:lr?k*w:0,y:lr?0:k*h,w,h}; x.drawImage(s.proc,c.x,c.y,c.w,c.h,r.x,r.y,w,h); rects.push(r); });
  drawTextOverlay(x,cv.width,cv.height,rects);
  return cv;
}
/* 비포·애프터 각각: 맞춘 구도 그대로, 보정 전 원본 */
function separateImage(s){
  const a=slotAspect(); const c=cropOf(s,a);
  const k=Math.min(1, 2400/Math.max(c.w,c.h));
  const cv=document.createElement('canvas'); cv.width=Math.round(c.w*k); cv.height=Math.round(c.h*k);
  const x=cv.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(s.orig,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height);
  return cv;
}

let resultURLs=[];
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
/* items: [{blob, name, label?}], extras: [{label, fn}] */
function showResult(items, extras){
  resultURLs.forEach(u=>URL.revokeObjectURL(u)); resultURLs=items.map(it=>URL.createObjectURL(it.blob));
  const files=items.map(it=>new File([it.blob],it.name,{type:it.blob.type||'image/jpeg'}));

    const share=async(mail)=>{

/* 모델 주소 여러 개 × GPU/CPU 차례로 시도 */
async function tryCreate(make, urls){

  for(const u of urls) for(const d of ['GPU','CPU']){ try{ return await make(u,d); }catch(e){ err=e; } }
  throw err||new Error('model load failed');

function getFace(){

  faceP.catch(()=>{ faceP=null; });

/* =========================================================
   14. 이미지 처리 도구 (흐림·피부 판별)
   ========================================================= */
function boxPass(s,d,W,H,r,ch,horiz){
  const k=1/(2*r+1), outer=horiz?H:W, inner=horiz?W:H, last=inner-1, step=(horiz?1:W)*ch;
  for(let o=0;o<outer;o++){
    const base=(horiz? o*W : o)*ch;
    for(let c=0;c<ch;c++){
      const b=base+c; let acc=0;
      for(let i=-r;i<=r;i++){ const ii=i<0?0:(i>last?last:i); acc+=s[b+ii*step]; }
      for(let i=0;i<inner;i++){
        d[b+i*step]=acc*k;
        const a=i+r+1, z=i-r;
        acc+=s[b+(a>last?last:a)*step]-s[b+(z<0?0:z)*step];
      }
    }
  }
}
/* RGBA(Uint8) → 흐린 RGB(Float32) */
function blurRGB(src,W,H,r,passes){
  const n=W*H; let a=new Float32Array(n*3), b=new Float32Array(n*3);
  for(let i=0;i<n;i++){ a[i*3]=src[i*4]; a[i*3+1]=src[i*4+1]; a[i*3+2]=src[i*4+2]; }
  r=Math.max(1,Math.round(r));
  for(let p=0;p<(passes||3);p++){ boxPass(a,b,W,H,r,3,true); boxPass(b,a,W,H,r,3,false); }
  return a;
}
function blur1(src,W,H,r,passes){
  let a=Float32Array.from(src), b=new Float32Array(W*H);
  r=Math.max(1,Math.round(r));
  for(let p=0;p<(passes||2);p++){ boxPass(a,b,W,H,r,1,true); boxPass(b,a,W,H,r,1,false); }
  return a;
}
function sstep(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }
function skinP(r,g,b){
  const y=0.299*r+0.587*g+0.114*b;
  const cb=128-0.168736*r-0.331264*g+0.5*b, cr=128+0.5*r-0.418688*g-0.081312*b;
  return sstep(66,77,cb)*(1-sstep(128,138,cb))*sstep(128,138,cr)*(1-sstep(176,186,cr))*sstep(25,55,y);
}

const ED_TOOLS=[['part','🎯 부위 보정'],['sharp','🔍 선명도'],['color','🎨 색감'],['bright','☀️ 밝기'],['smooth','💧 매끄럽게'],['mosaic','▦ 모자이크'],['face','🙂 얼굴 보정'],['bg','✂️ 배경 잘라내기']];
const ED_DEF={part:0,sharp:0,sat:0,warm:0,bright:0,contrast:0,smooth:0,slim:0,chin:0,contour:0,width:0,msize:40,brush:40,bg:'none'};
const ED={base:null,W:0,H:0,lm:null,lmState:'none',seg:null,segState:'none',p:Object.assign({},ED_DEF),tool:'part',

function edFit(){
  if(!ED.base) return;
  const st=$('#edStage'); const W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;
  const k=Math.min(W/ED.W, H/ED.H);
  edCv.style.width=Math.floor(ED.W*k)+'px'; edCv.style.height=Math.floor(ED.H*k)+'px';
}
function edBusy(msg){ const b=$('#edBusy'); if(msg){ b.textContent=msg; b.classList.remove('hidden'); } else b.classList.add('hidden'); }

async function edDetectFace(){
  if(ED.lmState==='loading'||ED.lmState==='ok') return;
  const myBase=ED.base; ED.lmState='loading'; edPanel();
  try{
    const fl=await getFace();
    if(ED.base!==myBase) return;
    const r=fl.detect(ED.baseCanvas);
    const pts=r && r.faceLandmarks && r.faceLandmarks[0];
    if(pts && pts.length>=468){ ED.lm=pts.map(p=>({x:p.x*ED.W,y:p.y*ED.H})); ED.lmState='ok'; }
    else { ED.lm=null; ED.lmState='noface'; }
  }catch(e){ console.warn(e); if(ED.base!==myBase) return; ED.lm=null; ED.lmState='fail'; }
  ED.s1Key=''; edPanel(); edRender();
}
async function edSegment(){
  if(ED.segState==='loading'||ED.segState==='ok') return;
  const myBase=ED.base; ED.segState='loading'; edBusy('배경 인식 중… (처음엔 몇 초 걸려요)'); edPanel();
  try{
    const sg=await getSeg();
    if(ED.base!==myBase) return;
    const res=sg.segment(ED.baseCanvas);
    const masks=res.confidenceMasks||[];
    let mk = masks.length>1 ? masks[masks.length-1] : masks[0];
    if(!mk) throw new Error('no mask');
    const mw=mk.width, mh=mk.height, md=mk.getAsFloat32Array();
    let prob=new Float32Array(ED.W*ED.H);
    for(let y=0;y<ED.H;y++){ const sy=Math.min(mh-1,Math.floor(y*mh/ED.H)); for(let x=0;x<ED.W;x++){ prob[y*ED.W+x]=md[sy*mw+Math.min(mw-1,Math.floor(x*mw/ED.W))]; } }
    masks.forEach(m=>{ try{ m.close(); }catch(e){} });
    // 가운데(사람)보다 가장자리(배경)가 더 높으면 뒤집기
    let c=0,cn=0,b=0,bn=0;
    for(let y=0;y<ED.H;y+=4) for(let x=0;x<ED.W;x+=4){ const v=prob[y*ED.W+x]; const ex=Math.abs(x/ED.W-0.5), ey=Math.abs(y/ED.H-0.5);
      if(ex<0.15&&ey<0.15){c+=v;cn++;} else if(ex>0.45||ey>0.45){b+=v;bn++;} }
    if(cn&&bn && b/bn > c/cn) for(let i=0;i<prob.length;i++) prob[i]=1-prob[i];
    ED.seg=blur1(prob,ED.W,ED.H,Math.max(1,ED.W/500),1); ED.segState='ok';
  }catch(e){ console.warn(e); if(ED.base!==myBase) return; ED.seg=null; ED.segState='fail'; toast('배경 인식을 할 수 없어요. 인터넷 연결을 확인해 주세요.',3000); }
  edBusy(null); edPanel(); edRender();
}

/* 얼굴 부위 번호 (MediaPipe 얼굴 468점) */
const LM={

/* 보정에서 뺄 부위 마스크 (1=보호) */
function protectMask(groups){
  const W=ED.W,H=ED.H; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.strokeStyle='#fff'; x.lineJoin='round';

  groups.forEach(([ids,dil])=>{ x.lineWidth=Math.max(2,fw*dil*2); x.beginPath(); ids.forEach((i,k)=>{ const p=ED.lm[i]; k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y); }); x.closePath(); x.fill(); x.stroke(); });

/* 얼굴 인식이 안 될 때: 주변보다 어두운 부분(눈·눈썹)을 보호 */

function faceCtrls(){

  if(ct){ side([234,454,127,356],0.07*ct,0.15); side([172,397,136,365],0.11*ct,0.14); side([150,379,149,378],0.08*ct,0.12);

function warp(src){
  const W=ED.W,H=ED.H; const ctr=faceCtrls(); if(!ctr.length) return src;
  const dst=new Uint8ClampedArray(src);
  let x0=W,y0=H,x1=0,y1=0; ctr.forEach(c=>{ x0=Math.min(x0,c.x-2*c.r); y0=Math.min(y0,c.y-2*c.r); x1=Math.max(x1,c.x+2*c.r); y1=Math.max(y1,c.y+2*c.r); });
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0)); x1=Math.min(W-1,Math.ceil(x1)); y1=Math.min(H-1,Math.ceil(y1));
  const n=ctr.length, cx=new Float32Array(n), cy=new Float32Array(n), dx=new Float32Array(n), dy=new Float32Array(n), ir=new Float32Array(n);
  ctr.forEach((c,i)=>{ cx[i]=c.x; cy[i]=c.y; dx[i]=c.dx; dy[i]=c.dy; ir[i]=1/(c.r*c.r); });
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      let sx=0, sy=0, sw=0;
      for(let i=0;i<n;i++){ const ddx=x-cx[i], ddy=y-cy[i]; const e=(ddx*ddx+ddy*ddy)*ir[i]; if(e>4) continue; const w=Math.exp(-e); sx+=dx[i]*w; sy+=dy[i]*w; sw+=w; }

      const fx=Math.min(W-1.001,Math.max(0,x-sx*nrm)), fy=Math.min(H-1.001,Math.max(0,y-sy*nrm));

      for(let c=0;c<3;c++) dst[o+c]=(src[i00+c]*(1-ax)+src[i10+c]*ax)*(1-ay)+(src[i01+c]*(1-ax)+src[i11+c]*ax)*ay;

}
/* 피부 매끄럽게: 부위 보정(part) + 전체 매끄럽게(smooth) */
function smoothSkin(src){
  const W=ED.W,H=ED.H,n=W*H, p=ED.p;
  const part=p.part/100, gen=p.smooth/100; if(!part && !gen) return src;
  const r=Math.max(2,Math.round(Math.min(W,H)/150));
  const bl=blurRGB(src,W,H,r,3);
  const proc=S.proc;
  let exProc=null, exBase=null;
  if(ED.lm){
    if(proc==='brow') exProc=protectMask([[LM.browL,0.035],[LM.browR,0.035],[LM.eyeL,0.025],[LM.eyeR,0.025],[LM.lips,0.012]]);
    else if(proc==='lash') exProc=protectMask([[LM.eyeL,0.06],[LM.eyeR,0.06],[LM.browL,0.02],[LM.browR,0.02],[LM.lips,0.012]]);
    exBase=protectMask([[LM.eyeL,0.025],[LM.eyeR,0.025],[LM.browL,0.015],[LM.browR,0.015],[LM.lips,0.012]]);
  } else if(proc!=='body'){
    exProc=darkProtect(src); exBase=exProc;

  for(let i=0;i<n;i++){
    const o=i*4, R=src[o],G=src[o+1],B=src[o+2];
    const sk=skinP(R,G,B); if(sk<0.02) continue;
    const br=bl[i*3], bg=bl[i*3+1], bb=bl[i*3+2];
    const dl=Math.abs((0.299*R+0.587*G+0.114*B)-(0.299*br+0.587*bg+0.114*bb));
    const edge=Math.exp(-(dl*dl)/(2*20*20));

    if(a<=0) continue;

}
function colorAdj(d){
  const p=ED.p; const sat=1+p.sat/50, warm=p.warm*0.7, bright=p.bright*1.4, con=1+p.contrast/100;
  for(let o=0;o<d.length;o+=4){
    let r=d[o],g=d[o+1],b=d[o+2];
    const l=0.299*r+0.587*g+0.114*b;
    r=l+(r-l)*sat; g=l+(g-l)*sat; b=l+(b-l)*sat;
    r+=warm; b-=warm; g+=warm*0.15;
    r=(r-128)*con+128+bright; g=(g-128)*con+128+bright; b=(b-128)*con+128+bright;
    d[o]=r; d[o+1]=g; d[o+2]=b;
  }
}
function sharpen(src){
  const W=ED.W,H=ED.H, amt=ED.p.sharp/100*1.6;
  const bl=blurRGB(src,W,H,1,2); const out=new Uint8ClampedArray(src);
  for(let i=0,n=W*H;i<n;i++){ const o=i*4; for(let c=0;c<3;c++){ const v=src[o+c]; out[o+c]=v+(v-bl[i*3+c])*amt; } }
  return out;
}
function applyMosaic(d){
  const W=ED.W,H=ED.H;
  const md=ED.mosaic.getContext('2d').getImageData(0,0,W,H).data;
  const bs=Math.max(4,Math.round(Math.min(W,H)*(0.01+ED.p.msize/100*0.06)));
  for(let by=0;by<H;by+=bs) for(let bx=0;bx<W;bx+=bs){
    const ex=Math.min(W,bx+bs), ey=Math.min(H,by+bs); let any=false;
    for(let y=by;y<ey&&!any;y+=2) for(let x=bx;x<ex;x+=2){ if(md[(y*W+x)*4+3]>0){ any=true; break; } }
    if(!any) continue;
    let r=0,g=0,b=0,c=0;
    for(let y=by;y<ey;y++) for(let x=bx;x<ex;x++){ const o=(y*W+x)*4; r+=d[o]; g+=d[o+1]; b+=d[o+2]; c++; }
    r/=c; g/=c; b/=c;
    for(let y=by;y<ey;y++) for(let x=bx;x<ex;x++){ const i=y*W+x, o=i*4, a=md[i*4+3]/255; if(!a) continue; d[o]+= (r-d[o])*a; d[o+1]+=(g-d[o+1])*a; d[o+2]+=(b-d[o+2])*a; }
  }
}
function edStage1(){
  const p=ED.p;
  const key=JSON.stringify([S.proc,p.part,p.smooth,p.sharp,p.sat,p.warm,p.bright,p.contrast,p.slim,p.chin,p.contour,p.width,ED.lmState]);
  if(key===ED.s1Key && ED.s1) return ED.s1;
  let d=ED.base.data;
  if(ED.lm && (p.slim||p.chin||p.contour||p.width)) d=warp(d);
  if(p.part||p.smooth) d=smoothSkin(d);
  if(d===ED.base.data) d=new Uint8ClampedArray(d);
  if(p.sat||p.warm||p.bright||p.contrast) colorAdj(d);
  if(p.sharp) d=sharpen(d);

}
function edCompose(){
  const s1=edStage1(); const d=new Uint8ClampedArray(s1);
  if(ED.mosaicUndo.length || ED._mosaicDirty) applyMosaic(d);
  const bg=ED.p.bg;
  if(bg!=='none' && ED.seg){
    const m=ED.seg, n=ED.W*ED.H;
    if(bg==='blur'){
      if(ED.blurBgKey!==ED.s1Key || !ED.blurBg){ ED.blurBg=blurRGB(d,ED.W,ED.H,Math.max(4,Math.min(ED.W,ED.H)/45),3); ED.blurBgKey=ED.s1Key; }
      const bb=ED.blurBg;
      for(let i=0;i<n;i++){ const a=m[i], o=i*4; d[o]=d[o]*a+bb[i*3]*(1-a); d[o+1]=d[o+1]*a+bb[i*3+1]*(1-a); d[o+2]=d[o+2]*a+bb[i*3+2]*(1-a); }
    } else if(bg==='transparent'){
      for(let i=0;i<n;i++) d[i*4+3]=Math.round(m[i]*255);

let edTimer=0;
function edRender(fast){

    const slow = !ED.s1 || ED.s1Key!==JSON.stringify([S.proc,ED.p.part,ED.p.smooth,ED.p.sharp,ED.p.sat,ED.p.warm,ED.p.bright,ED.p.contrast,ED.p.slim,ED.p.chin,ED.p.contour,ED.p.width,ED.lmState]);

}

/* 모자이크 브러시 */
(()=>{
  let drawing=false, last=null;
  const toImg=e=>{ const r=edCv.getBoundingClientRect(); return {x:(e.clientX-r.left)*ED.W/r.width, y:(e.clientY-r.top)*ED.H/r.height}; };
  edCv.addEventListener('pointerdown',e=>{
    if(!ED.base || ED.tool!=='mosaic' || !ED.mosaicOn) return;
    edCv.setPointerCapture(e.pointerId); drawing=true; last=toImg(e);
    const mx=ED.mosaic.getContext('2d');
    ED.mosaicUndo.push(mx.getImageData(0,0,ED.W,ED.H)); if(ED.mosaicUndo.length>12) ED.mosaicUndo.shift();
    ED._mosaicDirty=true; stroke(last,last);
  });
  edCv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=toImg(e); stroke(last,p); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false; edRender(true); edPanel(); };
  edCv.addEventListener('pointerup',end); edCv.addEventListener('pointercancel',end);
  let t=0;
  function stroke(a,b){
    const mx=ED.mosaic.getContext('2d'); mx.strokeStyle='#fff'; mx.fillStyle='#fff'; mx.lineCap='round'; mx.lineJoin='round';
    mx.lineWidth=Math.min(ED.W,ED.H)*(0.02+ED.p.brush/100*0.12);
    mx.beginPath(); mx.moveTo(a.x,a.y); mx.lineTo(b.x+0.01,b.y); mx.stroke();
    const now=Date.now(); if(now-t>90){ t=now; ED.out.getContext('2d').putImageData(edCompose(),0,0); edShow(); }
  }
})();

const COL_LAYOUTS={
  '2v':[[0,0,1,.5],[0,.5,1,.5]], '2h':[[0,0,.5,1],[.5,0,.5,1]],
  '3v':[[0,0,1,1/3],[0,1/3,1,1/3],[0,2/3,1,1/3]], '3h':[[0,0,1/3,1],[1/3,0,1/3,1],[2/3,0,1/3,1]],

  '4a':[[0,0,1,.6],[0,.6,1/3,.4],[1/3,.6,1/3,.4],[2/3,.6,1/3,.4]],

  '9':[0,1,2].flatMap(r=>[0,1,2].map(c=>[c/3,r/3,1/3,1/3]))
};
const COL_RATIOS=[['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['9:16','9:16'],['16:9','16:9']];
const COL_BG=['#ffffff','#000000','#f7efe6','#ffe3ec','#1f2937','#ff7a1a'];
const CL={layout:'2h',ratio:'4:5',gap:12,radius:0,bg:'#ffffff',cells:[],texts:[],sel:-1};
const colCv=$('#colCanvas'); let colW=100,colH=100;

function colRatio(){ const [a,b]=CL.ratio.split(':').map(Number); return a/b; }
function colEnsureCells(){ const n=COL_LAYOUTS[CL.layout].length; while(CL.cells.length<n) CL.cells.push({img:null,z:1,cx:0,cy:0}); }
function colRects(W,H){
  const g=CL.gap/1000*Math.min(W,H)*2.2;
  return COL_LAYOUTS[CL.layout].map(([rx,ry,rw,rh])=>{
    const x=rx*W+(rx<0.001?g:g/2), y=ry*H+(ry<0.001?g:g/2);
    const x2=(rx+rw)*W-((rx+rw)>0.999?g:g/2), y2=(ry+rh)*H-((ry+rh)>0.999?g:g/2);
    return {x,y,w:Math.max(1,x2-x),h:Math.max(1,y2-y)};
  });
}
function colLayoutChips(){
  $('#colLayouts').innerHTML=Object.entries(COL_LAYOUTS).map(([k,rs])=>`<button class="lchip ${CL.layout===k?'on':''}" data-l="${k}"><svg viewBox="0 0 40 40">${rs.map(([x,y,w,h])=>`<rect x="${x*40+1.5}" y="${y*40+1.5}" width="${w*40-3}" height="${h*40-3}" rx="2" fill="${CL.layout===k?'#111':'#cfd3da'}"/>`).join('')}</svg></button>`).join('');
  $('#colLayouts').querySelectorAll('.lchip').forEach(b=>b.onclick=()=>{ CL.layout=b.dataset.l; colEnsureCells(); colLayoutChips(); colLayout(); });
}
function colLayout(){
  colEnsureCells();
  const st=$('#colStage'); const W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;
  const a=colRatio(); if(W/H>a){ colH=H; colW=H*a; } else { colW=W; colH=W/a; }
  colW=Math.floor(colW); colH=Math.floor(colH);
  colCv.style.width=colW+'px'; colCv.style.height=colH+'px';
  const k=dpr(); colCv.width=Math.round(colW*k); colCv.height=Math.round(colH*k);
  CL.cells.forEach((c,i)=>colClamp(i));
  colDraw();
}
function cellAspect(i){ const r=colRects(colW,colH)[i]; return r? r.w/r.h : 1; }
function colClamp(i){
  const c=CL.cells[i]; if(!c||!c.img) return; const a=cellAspect(i);
  c.z=Math.max(1,Math.min(10,c.z));
  const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,a);
  c.cx=Math.max(cr.w/2,Math.min(c.img.width-cr.w/2,c.cx)); c.cy=Math.max(cr.h/2,Math.min(c.img.height-cr.h/2,c.cy));
}
function rr(x,a,b,w,h,r){ x.beginPath(); if(r>0 && x.roundRect) x.roundRect(a,b,w,h,r); else x.rect(a,b,w,h); }
function textBox(x,t,W){
  const fs=t.size/100*W; x.font=`${t.bold?'700':'400'} ${fs}px ${fontCanvas(t.font)}`;
  const lines=(t.text||' ').split('\n'); const lh=fs*1.25;
  const tw=Math.max(...lines.map(l=>x.measureText(l).width));
  return {fs,lines,lh,w:tw,h:lh*lines.length};
}
function colRender(x,W,H,forExport){
  x.save(); x.fillStyle=CL.bg; x.fillRect(0,0,W,H);
  const rects=colRects(W,H); const rad=CL.radius/100*Math.min(W,H)*0.12;
  rects.forEach((r,i)=>{
    const c=CL.cells[i];
    x.save(); rr(x,r.x,r.y,r.w,r.h,rad); x.clip();
    if(c && c.img){
      const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,r.w/r.h);
      x.imageSmoothingQuality='high'; x.drawImage(c.img,cr.x,cr.y,cr.w,cr.h,r.x,r.y,r.w,r.h);
    } else if(!forExport){
      x.fillStyle='rgba(128,128,128,.22)'; x.fillRect(r.x,r.y,r.w,r.h);
      x.fillStyle='rgba(120,120,120,.9)'; x.font=`800 ${Math.max(12,Math.min(r.w,r.h)*0.14)}px ${getComputedStyle(document.body).fontFamily}`;
      x.textAlign='center'; x.textBaseline='middle'; x.fillText('＋ 사진', r.x+r.w/2, r.y+r.h/2);
    }
    x.restore();
  });
  CL.texts.forEach((t,i)=>{
    const b=textBox(x,t,W); const cx=t.x*W, cy=t.y*H;
    x.textAlign='center'; x.textBaseline='middle';
    const top=cy-b.h/2;
    if(t.box){ const pad=b.fs*0.35; x.fillStyle=t.boxColor||'rgba(0,0,0,.55)'; rr(x,cx-b.w/2-pad,top-pad*0.6,b.w+pad*2,b.h+pad*1.2,pad); x.fill(); }
    b.lines.forEach((l,k)=>{
      const y=top+b.lh*(k+0.5);
      if(t.outline){ x.lineJoin='round'; x.lineWidth=Math.max(2,b.fs*0.14); x.strokeStyle=t.outlineColor||'#000'; x.strokeText(l,cx,y); }
      if(t.shadow){ x.shadowColor='rgba(0,0,0,.55)'; x.shadowBlur=b.fs*0.25; }
      x.fillStyle=t.color; x.fillText(l,cx,y); x.shadowBlur=0;
    });
    if(!forExport && i===CL.sel){ x.setLineDash([6,5]); x.strokeStyle='#ff7a1a'; x.lineWidth=Math.max(1.5,W/300); x.strokeRect(cx-b.w/2-8,top-6,b.w+16,b.h+12); x.setLineDash([]); }
  });
  x.restore();
}
function colDraw(){ const x=colCv.getContext('2d'); colRender(x,colCv.width,colCv.height,false); }
async function colEnsureFont(t){ if(t.font==='system' || !document.fonts) return; try{ await document.fonts.load(`${t.bold?'700':'400'} 40px "${t.font}"`, t.text||'가A'); }catch(e){} }
async function colSetCellFile(i,file){
  try{ const c=await loadFile(file,2000); CL.cells[i]={img:c,z:1,cx:c.width/2,cy:c.height/2}; colClamp(i); colDraw(); }
  catch(e){ toast('사진을 불러오지 못했어요'); }
}
let colTarget=-1;
function colPick(i){ colTarget=i; const f=$('#fileCollage'); f.value=''; f.multiple = i<0; f.click(); }
$('#fileCollage').addEventListener('change',async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  colEnsureCells();
  if(colTarget>=0){ await colSetCellFile(colTarget,files[0]); return; }
  let fi=0; const n=COL_LAYOUTS[CL.layout].length;
  for(let i=0;i<n && fi<files.length;i++){ if(!CL.cells[i].img){ await colSetCellFile(i,files[fi++]); } }
  for(let i=0;i<n && fi<files.length;i++){ await colSetCellFile(i,files[fi++]); }

});

/* 콜라주 손가락 조작 */
(()=>{
  const pts=new Map(); let mode=null, idx=-1, moved=0, lastTap=0, lastTapIdx=-1;
  const local=e=>{ const r=colCv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };
  function hitText(p){
    const x=colCv.getContext('2d'); const W=colCv.width,H=colCv.height;
    for(let i=CL.texts.length-1;i>=0;i--){ const t=CL.texts[i]; const b=textBox(x,t,W);
      if(Math.abs(p.x*W-t.x*W)<=b.w/2+14 && Math.abs(p.y*H-t.y*H)<=b.h/2+12) return i; }
    return -1;
  }
  function hitCell(p){ const rs=colRects(1,1); for(let i=0;i<rs.length;i++){ const r=rs[i]; if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h) return i; } return -1; }
  colCv.addEventListener('pointerdown',e=>{
    colCv.setPointerCapture(e.pointerId); const p=local(e); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ moved=0; const ti=hitText(p); if(ti>=0){ mode='text'; idx=ti; CL.sel=ti; } else { mode='cell'; idx=hitCell(p); CL.sel=-1; } colDraw(); }
  });
  colCv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=new Map(pts); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(mode==='text' && idx>=0 && pts.size===1){
      const p0=prev.get(e.pointerId), p1=pts.get(e.pointerId); const r=colCv.getBoundingClientRect();
      const t=CL.texts[idx]; t.x=Math.min(1,Math.max(0,t.x+(p1.x-p0.x)/r.width)); t.y=Math.min(1,Math.max(0,t.y+(p1.y-p0.y)/r.height));
      moved+=Math.abs(p1.x-p0.x)+Math.abs(p1.y-p0.y); colDraw(); return;
    }
    if(mode==='cell' && idx>=0){
      const c=CL.cells[idx]; if(!c||!c.img) return;
      const rect=colRects(colW,colH)[idx]; const sc=()=>{ const cr=cropFor(c.img.width,c.img.height,c.z,c.cx,c.cy,rect.w/rect.h); return rect.w/cr.w; };
      if(pts.size===1){ const p0=prev.get(e.pointerId), p1=pts.get(e.pointerId); const s=sc(); c.cx-=(p1.x-p0.x)/s; c.cy-=(p1.y-p0.y)/s; moved+=Math.abs(p1.x-p0.x)+Math.abs(p1.y-p0.y); }
      else { const ids=[...pts.keys()].slice(0,2); const a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=pts.get(ids[0]),b1=pts.get(ids[1]);
        const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1, d1=Math.hypot(a1.x-b1.x,a1.y-b1.y)||1; c.z*=d1/d0;
        const m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2}, m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2}; const s=sc(); c.cx-=(m1.x-m0.x)/s; c.cy-=(m1.y-m0.y)/s; moved+=99; }
      colClamp(idx); colDraw();
    }
  });
  const up=e=>{
    if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if(pts.size>0) return;
    if(moved<6){
      const now=Date.now();
      if(mode==='text' && idx>=0) textSheet(idx);
      else if(mode==='cell' && idx>=0){
        const c=CL.cells[idx];
        if(!c||!c.img) colPick(idx);
        else if(now-lastTap<320 && lastTapIdx===idx){ c.z=1; c.cx=c.img.width/2; c.cy=c.img.height/2; colDraw(); }
        else { const i=idx; setTimeout(()=>{ if(Date.now()-lastTap>=300 && lastTapIdx===i) cellMenu(i); },330); }
      }
      lastTap=now; lastTapIdx=idx;
    }
    mode=null;
  };
  colCv.addEventListener('pointerup',up); colCv.addEventListener('pointercancel',up);
})();
function cellMenu(i){
  openSheet(`<h2>${i+1}번 칸 <button data-close>✕</button></h2><div class="list">
    <button class="big" id="cm1">🖼 다른 사진으로 바꾸기</button>
    <button class="big" id="cm2">🎨 이 사진 편집하기</button>
    <button class="big" id="cm3">🗑 이 칸 비우기</button></div>`, sh=>{

  openSheet(`<h2>🎛 꾸미기 <button data-close>✕</button></h2>
    <h3>전체 비율</h3><div class="opts">${COL_RATIOS.map(([v,l])=>`<button class="chip ${CL.ratio===v?'on':''}" data-r="${v}">${l}</button>`).join('')}</div>
    <div class="field"><label>칸 간격</label><input type="range" min="0" max="40" id="cGap" value="${CL.gap}"><span class="val">${CL.gap}</span></div>
    <div class="field"><label>둥근 모서리</label><input type="range" min="0" max="100" id="cRad" value="${CL.radius}"><span class="val">${CL.radius}</span></div>
    <h3>바탕색</h3><div class="colorRow">${COL_BG.map(c=>`<button class="sw ${CL.bg===c?'on':''}" style="background:${c}" data-b="${c}"></button>`).join('')}<input type="color" id="cBg" value="${CL.bg}"></div>`, sh=>{
    sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ CL.ratio=b.dataset.r; sh.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b)); colLayout(); });
    sh.querySelector('#cGap').oninput=e=>{ CL.gap=+e.target.value; e.target.nextElementSibling.textContent=e.target.value; CL.cells.forEach((c,i)=>colClamp(i)); colDraw(); };
    sh.querySelector('#cRad').oninput=e=>{ CL.radius=+e.target.value; e.target.nextElementSibling.textContent=e.target.value; colDraw(); };
    sh.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ CL.bg=b.dataset.b; sh.querySelectorAll('[data-b]').forEach(x=>x.classList.toggle('on',x===b)); colDraw(); });
    sh.querySelector('#cBg').oninput=e=>{ CL.bg=e.target.value; colDraw(); };
  });
};
async function colSave(){
  if(!CL.cells.some(c=>c&&c.img) && !CL.texts.length){ toast('먼저 사진을 넣어 주세요'); return; }
  for(const t of CL.texts) await colEnsureFont(t);
  const a=colRatio(), long=2000; const W=Math.round(a>=1?long:long*a), H=Math.round(a>=1?long/a:long);
  // 화면 비율과 저장 비율이 같으므로 칸 안의 확대·위치도 그대로 맞음
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  colRender(cv.getContext('2d'),W,H,true);
  showResult([{blob:await toBlob(cv,'image/jpeg',0.93), name:`collage_${stamp()}.jpg`}]);
}
$('#colSave').onclick=colSave; $('#colSave2').onclick=colSave;

/* =========================================================
   17. 앱 설치 (PWA) · 시작
   ========================================================= */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('#installBtn').classList.remove('hidden'); });
$('#installBtn').onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; $('#installBtn').classList.add('hidden'); };
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('resize',()=>{ layout(); if(camOn) layoutCam(); colLayout(); edFit(); });
window.addEventListener('orientationchange',()=>setTimeout(()=>{ layout(); if(camOn) layoutCam(); colLayout(); edFit(); },300));
document.addEventListener('visibilitychange',()=>{ if(document.hidden && camOn) stopStream(); else if(!document.hidden && camOn && !stream) startStream(); });
history.replaceState({s:'home'},'');
updateSeg(); renderProcSeg(); renderGuideChips(); buildSlots(); colEnsureCells(); colLayoutChips(); edPanel();
</script>
